[package]
name = "kiln-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
kiln-core = { version = "0.1.0", path = "../kiln-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "io-util"] }

[[bin]]
name = "kiln"
path = "src/main.rs"
