<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln</title>
<style>
/* Barra arriba, lienzo del grafo a la izquierda, ficha del nodo a la derecha. */
:root {
  --bg: #eef0ec; --grid: #d9ddd4; --panel: #ffffff; --fg: #1d221c; --muted: #5d6658; --line: #c5cbbf; --accent: #b4561f;
  --ok: #3d7a3a; --okbg: #e3efdf; --warn: #a06a00; --warnbg: #f7ecd2; --bad: #b13a2e; --badbg: #f6e0dc; --info: #2f5f8a; --infobg: #dde8f2;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, "Cascadia Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #161a15; --grid: #232822; --panel: #1f241e; --fg: #e6eae2; --muted: #9aa393; --line: #3a4237; --accent: #e08a4e;
  --ok: #8cc887; --okbg: #22331f; --warn: #e2b04f; --warnbg: #3a2f17; --bad: #ec8476; --badbg: #3d221e; --info: #8ab8e2; --infobg: #1d2b38; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px var(--font); display: flex; flex-direction: column; padding: 12px 16px; gap: 10px; }
.tabs { display: flex; } .tabs button { border-radius: 0; } .tabs button:first-child { border-radius: 6px 0 0 6px; } .tabs button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
#crumbs { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; min-height: 18px; }
#crumbs a { color: var(--fg); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; } #crumbs a:last-child { font-weight: 600; text-decoration: none; }
.bar { height: 5px; border-radius: 3px; background: var(--badbg); margin-top: 6px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--ok); }
.k-game .hd i { background: var(--fg); } .k-place .hd i { background: #7a4fa0; } .k-building .hd i { background: var(--accent); } .k-room .hd i { background: var(--info); } .k-asset .hd i { background: var(--ok); }
.missing-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; border-top: 1px solid var(--line); padding: 5px 0; font-size: 13px; }
.missing-row button { font-size: 12px; padding: 4px 8px; }
form { display: flex; gap: 6px; flex: 1 1 320px; min-width: 0; } form input { flex: 1; }
.k-spec .hd i, .k-asset .hd i { background: var(--accent); } .k-ask .hd i { background: var(--fg); } .k-src .hd i { background: var(--ok); } .k-check .hd i { background: var(--bad); }
.log { font: 12px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; border-top: 1px solid var(--line); padding: 5px 0; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
h1 { font-size: 18px; margin: 0; }
.tag { font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; font: 500 11.5px var(--mono); }
.stats span { padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
input { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); min-width: 0; flex: 0 1 260px; }
input:disabled { opacity: .6; }
button { font: 600 13px var(--font); padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
button:focus-visible, input:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { flex: 1; display: grid; grid-template-columns: 1fr 340px; gap: 10px; min-height: 0; }
#stage { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; cursor: grab; touch-action: none;
  background-color: var(--bg); background-image: radial-gradient(var(--grid) 1.2px, transparent 1.2px); background-size: 22px 22px; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
svg#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
svg#edges path { fill: none; stroke: var(--line); stroke-width: 2; }
svg#edges path.hot { stroke: var(--accent); stroke-width: 2.5; }
.col { position: absolute; font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.node { position: absolute; width: 200px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; user-select: none; }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.node.dim { opacity: .35; }
.node .hd { display: flex; align-items: center; gap: 6px; padding: 5px 9px; border-bottom: 1px solid var(--line); font: 500 10px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.node .hd i { width: 8px; height: 8px; border-radius: 2px; background: var(--muted); }
.node .hd b { margin-left: auto; font-weight: 500; }
.node .bd { padding: 6px 9px 8px; }
.node .t { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.node .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.k-project .hd i { background: var(--fg); } .k-kit .hd i { background: var(--accent); } .k-piece .hd i { background: var(--info); }
.k-slot .hd i { background: var(--warn); } .k-mat .hd i { background: var(--ok); }
.pill { display: inline-block; margin: 5px 4px 0 0; font: 500 10.5px var(--mono); padding: 1px 6px; border-radius: 4px; }
.ok { background: var(--okbg); color: var(--ok); } .warn { background: var(--warnbg); color: var(--warn); }
.error { background: var(--badbg); color: var(--bad); } .info { background: var(--infobg); color: var(--info); }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; overflow: auto; min-width: 0; }
aside h2 { font-size: 16px; margin: 2px 0 4px; overflow-wrap: anywhere; }
.kind { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 13px; margin: 12px 0; }
dt { color: var(--muted); } dd { margin: 0; font: 12px var(--mono); overflow-wrap: anywhere; }
.finding { font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--line); }
.finding code { font: 11px var(--mono); color: var(--muted); }
.note { font-size: 12px; color: var(--muted); }
.view3d { position: relative; height: 240px; margin: 10px 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); }
.view3d canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.view3d .note { position: absolute; left: 8px; bottom: 6px; }
.slotrow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: center; font-size: 13px; padding: 4px 0; border-top: 1px solid var(--line); }
.slotrow span { overflow-wrap: anywhere; font: 12px var(--mono); }
select { font: inherit; font-size: 12.5px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); min-width: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.k-build .hd i { background: #7a4fa0; }
.k-layer .hd i { background: var(--accent); } .k-claim .hd i { background: var(--info); } .k-claim.pinned .hd i { background: var(--ok); } .k-question .hd i { background: var(--warn); }
.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 8px 0; }
.cand { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; font-size: 12px; }
.cand img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--bg); display: block; }
.cand .cb { padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.cand .cb b { font-size: 12.5px; overflow-wrap: anywhere; } .cand .cb span { color: var(--muted); overflow-wrap: anywhere; }
.cand .ca { display: flex; gap: 6px; align-items: center; padding: 0 8px 8px; } .cand .ca a { color: var(--muted); font-size: 12px; } .cand .ca button { margin-left: auto; font-size: 12px; padding: 4px 8px; }
.round { border-top: 1px solid var(--line); padding: 8px 0; } .round summary { cursor: pointer; font-size: 13px; }
.sheets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; } .sheets img { width: 100%; display: block; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
textarea { font: inherit; width: 100%; min-height: 180px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); resize: vertical; }
.qcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 8px 0; }
.qcard .opts { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; } .qcard .opts button { text-align: left; font-weight: 500; }
.qcard .free { display: flex; gap: 6px; } .qcard .free input { flex: 1; }
.qcard .skip { display: flex; gap: 6px; margin-top: 8px; } .qcard .skip button { font-weight: 500; font-size: 12px; padding: 4px 8px; }
[hidden] { display: none !important; }
#wizard { flex: 1; overflow: auto; }
#wizard .wz { max-width: 640px; margin: 0 auto; padding: 8px 0 40px; display: flex; flex-direction: column; gap: 12px; }
#wizard h2 { font-size: 22px; margin: 0; } #wizard p { margin: 0; }
#wizard .wz input, #wizard .wz textarea { width: 100%; flex: none; } #wizard .qcard .free input { width: auto; flex: 1; }
#wizard .opts button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
#wizard .nav { display: flex; gap: 8px; justify-content: flex-end; } #wizard .nav .go { background: var(--accent); border-color: var(--accent); color: #fff; }
#wizard .nav .go:disabled { opacity: .5; cursor: default; }
#wizard .lrow { border-top: 1px solid var(--line); padding: 8px 0; } #wizard .lrow b { display: block; margin-bottom: 4px; }
#wizard .crow { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 13px; padding: 3px 0; }
#wizard .crow button { font-size: 12px; padding: 3px 8px; flex: none; }
.proposal { border-left: 3px solid var(--warn); padding: 4px 8px; margin: 8px 0; background: var(--warnbg); font-size: 13px; }
@media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } }
</style>
</head>
<body>
<header>
  <h1>Kiln</h1><span class="tag" id="proj">cargando…</span>
  <div class="stats" id="stats"></div>
  <input id="search" placeholder="Buscar pieza o material" aria-label="Buscar pieza o material">
  <form id="askForm"><input id="ask" placeholder="Pedir un asset: crear un ascensor" aria-label="Pedir un asset"><button type="submit">Desglosar</button></form>
  <nav class="tabs"><button type="button" data-mode="context">Contexto</button><button type="button" data-mode="tree">Árbol</button><button type="button" data-mode="catalog">Catálogo</button></nav>
  <button id="back" type="button" hidden>Volver</button>
  <button id="reload" type="button">Releer el proyecto</button>
</header>
<section id="wizard" hidden></section>
<div id="crumbs"></div>
<main>
  <div id="stage"><div id="world"><svg id="edges"></svg></div></div>
  <aside id="side"></aside>
</main>
<script>
const W = 200, GAP = 12, X = { project: 20, kit: 270, piece: 520, slot: 770, mat: 1060 };
let ctxData = null, ctxLayer = null;
let cat = null, openKit = null, sel = null, query = "", view = { x: 10, y: 10, z: 0.8 }, specView = null, job = null, mode = "tree", treeAt = null;
const LEVEL = { game: "Juego", place: "Lugar", building: "Edificio", room: "Sala", module: "Módulo", scene: "Escena", asset: "Asset" };
const lvl = l => LEVEL[l] || l;
const world = document.getElementById("world"), svg = document.getElementById("edges"), side = document.getElementById("side");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = v => v ? v.map(n => n.toFixed(2)).join(" × ") + " m" : "sin medir";
const worst = subject => { const f = cat.findings.filter(f => f.subject === subject); return f.find(x => x.severity === "error") ? "error" : f.find(x => x.severity === "warn") ? "warn" : f.length ? "info" : null; };
const PILL = { error: "error", warn: "aviso", info: "nota" };

async function load() {
  const r = await fetch("/api/catalog"); const j = await r.json();
  if (j.error) { side.innerHTML = `<div class="kind">Error</div><p>${esc(j.error)}</p>`; return; }
  cat = j; document.getElementById("proj").textContent = cat.project;
  ctxData = await (await fetch("/api/context")).json();
  const n = s => cat.findings.filter(f => f.severity === s).length;
  document.getElementById("stats").innerHTML = `<span>${cat.kits.length} kits</span><span>${cat.pieces.length} piezas</span><span>${cat.materials.length} materiales</span>`
    + `<span class="error">${n("error")} errores</span><span class="warn">${n("warn")} avisos</span><span class="info">${n("info")} notas</span>`;
  if (specView && !cat.specs.find(x => x.asset.id === specView)) specView = null;
  if (!cat.tree) mode = "catalog";
  render();
  if (!sel && !ctxData.context.claims.length) mode = "context";
  if (!sel) home();
}
function home() {
  specView = null;
  sel = mode === "tree" ? (treeAt || cat.tree?.root) : mode === "context" ? "game" : "project";
  render();
  if (mode === "tree" && cat.tree) showTreeNode(cat.tree.nodes[sel]);
  else if (mode === "context") showContext();
  else showProject();
}

function node(id, k, kind, title, sub, x, y, extra = "", badge = "") {
  return { id, k, html: `<div class="node k-${k}" data-id="${esc(id)}" tabindex="0" style="left:${x}px;top:${y}px"><div class="hd"><i></i>${esc(kind)}<b>${esc(badge)}</b></div><div class="bd"><div class="t">${esc(title)}</div><div class="s">${esc(sub)}</div>${extra}</div></div>`, x, y };
}
function pill(level) { return level ? `<span class="pill ${level}">${PILL[level]}</span>` : ""; }
function matches(text) { return !query || String(text).toLowerCase().includes(query); }

function render() {
  document.getElementById("back").hidden = !specView;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", !specView && b.dataset.mode === mode));
  crumbs();
  if (specView) return renderSpec(cat.specs.find(x => x.asset.id === specView));
  if (mode === "tree" && cat.tree) return renderTree();
  if (mode === "context") return renderContext();
  const nodes = [], edges = [];
  let y = 40;
  nodes.push(node("project", "project", "Proyecto", cat.project, cat.root, X.project, 40));
  cat.specs.forEach((sp, i) => { nodes.push(node("spec:" + sp.asset.id, "spec", "Ficha · " + sp.asset.status, sp.asset.name, `${sp.parts.length} piezas · «${sp.asset.asked}»`, X.project, 140 + i * 80, pill(specLevel(sp)))); });
  for (const k of cat.kits) {
    const pcs = cat.pieces.filter(p => p.kit === k.name);
    const hit = pcs.some(p => matches(p.key)) || matches(k.name);
    const lv = worst(k.path) || (pcs.map(p => worst(p.key)).includes("error") ? "error" : pcs.map(p => worst(p.key)).includes("warn") ? "warn" : null);
    const n = node("kit:" + k.name, "kit", "Kit", k.name, `${k.pieces} piezas · ${k.licenses.join(", ") || "sin licencia"}`, X.kit, y, pill(lv), openKit === k.name ? "▾" : "▸");
    if (!hit) n.html = n.html.replace('class="node', 'class="node dim');
    nodes.push(n); edges.push(["project", n.id]); y += 74;
  }
  if (openKit) {
    let py = 40;
    for (const p of cat.pieces.filter(p => p.kit === openKit)) {
      const n = node("piece:" + p.key, "piece", "Pieza · " + p.format, p.name, `${fmt(p.size_m)}${p.tris != null ? " · " + p.tris.toLocaleString("es") + " tri" : ""}`, X.piece, py, pill(worst(p.key)));
      if (!matches(p.key)) n.html = n.html.replace('class="node', 'class="node dim');
      nodes.push(n); edges.push(["kit:" + openKit, n.id]); py += 74;
    }
  }
  const piece = sel && sel.startsWith("piece:") ? cat.pieces.find(p => "piece:" + p.key === sel) : null;
  if (piece) {
    let sy = Math.max(40, (nodes.find(n => n.id === sel)?.y ?? 40) - 20);
    for (const s of piece.material_slots) {
      const bound = cat.materials.find(m => m.key === (piece.bindings[s] || s));
      const n = node("slot:" + piece.key + ":" + s, "slot", "Ranura", s, bound ? (piece.bindings[s] ? "vinculada a " + bound.key : "coincide con la paleta") : "sin vincular a la paleta", X.slot, sy, `<span class="pill ${bound ? "ok" : "warn"}">${bound ? "vinculada" : "sin vincular"}</span>`);
      nodes.push(n); edges.push([sel, n.id]); if (bound) edges.push([n.id, "mat:" + bound.key]); sy += 74;
    }
  }
  let my = 40;
  for (const m of cat.materials.filter(m => matches(m.key) || matches(m.name)).slice(0, 80)) {
    nodes.push(node("mat:" + m.key, "mat", m.source === "table" ? "Material · tabla" : "Material · textura", m.key, m.name !== m.key ? m.name : m.file, X.mat, my)); my += 66;
  }
  draw(nodes, edges, [["Proyecto y fichas", X.project], ["Kits", X.kit], ["Piezas", X.piece], ["Ranuras", X.slot], ["Paleta", X.mat]]);
  world.querySelectorAll(".node").forEach(el => {
    el.classList.toggle("sel", el.dataset.id === sel);
    el.addEventListener("click", () => pick(el.dataset.id));
    el.addEventListener("keydown", e => { if (e.key === "Enter") pick(el.dataset.id); });
  });
}
function draw(nodes, edges, cols, bands) {
  world.querySelectorAll(".node, .col").forEach(e => e.remove());
  world.insertAdjacentHTML("beforeend", cols.map(([l, x]) => `<div class="col" style="left:${x}px;top:10px">${l}</div>`).join("") + nodes.map(n => n.html).join(""));
  const byCol = {};
  world.querySelectorAll(".node").forEach(el => (byCol[el.offsetLeft] ??= []).push(el));
  if (bands) {
    // one band per group: its nodes in each column start level with the group's head
    const el = id => world.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
    let y = 40;
    for (const band of bands) {
      let bottom = y;
      for (const col of band) { let cy = y; for (const id of col) { const e = el(id); if (!e) continue; e.style.top = cy + "px"; cy += e.offsetHeight + GAP; } bottom = Math.max(bottom, cy); }
      y = bottom + GAP * 2;
    }
  } else for (const list of Object.values(byCol)) {
    list.sort((a, b) => a.offsetTop - b.offsetTop);
    let y = 0;
    for (const el of list) { y = Math.max(y, el.offsetTop); el.style.top = y + "px"; y += el.offsetHeight + GAP; }
  }
  const at = id => { const el = world.querySelector(`.node[data-id="${CSS.escape(id)}"]`); return el ? { x: el.offsetLeft, y: el.offsetTop + el.offsetHeight / 2 } : null; };
  svg.innerHTML = edges.map(([a, b]) => { const A = at(a), B = at(b); if (!A || !B) return "";
    const x1 = A.x + W, x2 = B.x, dx = Math.max(40, (x2 - x1) / 2), hot = sel && (a === sel || b === sel);
    return `<path class="${hot ? "hot" : ""}" d="M${x1},${A.y} C${x1 + dx},${A.y} ${x2 - dx},${B.y} ${x2},${B.y}"/>`; }).join("");
  apply();
}

// ---- The tree of the project, by levels ----
function pathTo(key) {
  const T = cat.tree.nodes, prev = { [cat.tree.root]: null }, q = [cat.tree.root];
  while (q.length) { const k = q.shift(); if (k === key) break; for (const c of T[k]?.children || []) if (!(c in prev)) { prev[c] = k; q.push(c); } }
  const out = []; for (let k = key; k; k = prev[k]) out.unshift(k); return out;
}
function crumbs() {
  const el = document.getElementById("crumbs");
  if (!cat || !cat.tree || mode !== "tree" || specView) { el.innerHTML = ""; return; }
  el.innerHTML = pathTo(treeAt || cat.tree.root).map(k => `<a data-k="${esc(k)}">${esc(cat.tree.nodes[k].name)}</a>`).join("<span>›</span>");
  el.querySelectorAll("a").forEach(a => a.onclick = () => { treeAt = a.dataset.k; sel = treeAt; render(); showTreeNode(cat.tree.nodes[treeAt]); });
}
function coverage(n) {
  if (!n.children.length) {
    const st = { model: ["ok", "con modelo"], spec: ["info", "con ficha"], missing: ["error", n.level === "asset" ? "falta" : "sin definir"] }[n.status] || ["info", n.status];
    return `<span class="pill ${st[0]}">${st[1]}</span>`;
  }
  const pct = n.assets ? Math.round(100 * n.modelled / n.assets) : 0;
  return `<div class="bar"><i style="width:${pct}%"></i></div><div class="s">${n.modelled} de ${n.assets} con modelo</div>`;
}
function renderTree() {
  const T = cat.tree.nodes, at = T[treeAt || cat.tree.root], C = [20, 290, 560, 830], nodes = [], edges = [];
  const mk = (n, x) => node(n.key, n.level, lvl(n.level) + (n.children.length ? ` · ${n.children.length}` : ""), n.name, n.name !== n.id ? n.id : (n.piece || n.file || ""), x, 40, coverage(n), n.children.length ? "▸" : "");
  nodes.push(mk(at, C[0]));
  at.children.forEach(c => { nodes.push(mk(T[c], C[1])); edges.push([at.key, c]);
    T[c].children.forEach(g => { if (!nodes.find(n => n.id === g)) nodes.push(mk(T[g], C[2])); edges.push([c, g]); }); });
  const label = keys => [...new Set(keys.map(k => lvl(T[k].level)))].join(" / ");
  const grand = at.children.flatMap(c => T[c].children);
  draw(nodes, edges, [[lvl(at.level), C[0]], [label(at.children), C[1]], [label(grand), C[2]]]);
  world.querySelectorAll(".node").forEach(el => {

});
async function follow() {
  const j = await (await fetch("/api/jobs/" + job)).json();
  side.innerHTML = `<div class="kind">Trabajo · ${j.status === "running" ? "en marcha" : j.status === "done" ? "hecho" : "falló"}</div><h2>«${esc(j.asked)}»</h2>` + j.log.map(l => `<div class="log">${esc(l)}</div>`).join("");
  side.scrollTop = side.scrollHeight;
  if (j.status === "running") return setTimeout(follow, 1500);
  job = null; await load();
  if (j.spec && ctxData && j.spec === ctxData.file) { mode = "context"; sel = "game"; render(); showContext(); side.insertAdjacentHTML("beforeend", `<div class="kind" style="margin-top:12px">Lo que hizo el agente</div>` + j.log.map(l => `<div class="log">${esc(l)}</div>`).join("")); return; }
  if (j.spec && j.spec.endsWith("review/review.json")) { const id = Object.keys(cat.builds).find(k => j.spec.startsWith(cat.builds[k].glb.replace(/[^/\\]+$/, "")) || j.spec.includes("/" + k + "/review/")); const sp = id && cat.specs.find(x => x.asset.id === id); if (sp) { specView = id; sel = "build"; render(); showBuild(sp); side.insertAdjacentHTML("beforeend", `<details class="round"><summary class="kind">Registro</summary>` + j.log.map(l => `<div class="log">${esc(l)}</div>`).join("") + `</details>`); } return; }
  if (j.spec && j.spec.endsWith(".glb")) { const id = Object.keys(cat.builds).find(k => cat.builds[k].glb === j.spec || Object.values(cat.builds[k].variants || {}).includes(j.spec)); const sp = id && cat.specs.find(x => x.asset.id === id); if (sp) { specView = id; sel = "build"; render(); showBuild(sp); side.insertAdjacentHTML("beforeend", `<div class="kind" style="margin-top:12px">Registro</div>` + j.log.map(l => `<div class="log">${esc(l)}</div>`).join("")); } return; }
  if (j.spec) { const sp = cat.specs.find(x => x.file === j.spec); if (sp) { specView = sp.asset.id; sel = "asset"; render(); pickSpec(sp, "asset"); side.insertAdjacentHTML("beforeend", `<div class="kind" style="margin-top:12px">Lo que hizo el agente</div>` + j.log.map(l => `<div class="log">${esc(l)}</div>`).join("")); } }
}

// Start wizard: a folder without kiln.toml, or a project made here whose start is not settled yet.
const WZ = ["Proyecto", "Lo básico", "Tu juego", "Preguntas", "Asentar"];
let wz = { step: 1, name: "", basics: {}, info: null };
const wzEl = document.getElementById("wizard");
async function start() {
  const n = await (await fetch("/api/new")).json();
  if (!n.step) { wzEl.hidden = true; document.querySelector("main").hidden = false; return load(); }
  wz.info = n; wz.step = n.step === 1 ? (wz.step === 2 ? 2 : 1) : Math.max(n.step, wz.step);
  document.querySelector("main").hidden = true; document.querySelectorAll("header > :not(h1):not(#proj)").forEach(e => e.hidden = true);
  document.getElementById("crumbs").hidden = true; wzEl.hidden = false;
  if (wz.step > 2) { ctxData = await (await fetch("/api/context")).json(); wz.name ||= (await (await fetch("/api/catalog")).json()).project; }
  document.getElementById("proj").textContent = wz.name || "juego nuevo";
  wzRender();
}
function wzFrame(body, nav) {
  wzEl.innerHTML = `<div class="wz"><div class="kind">Paso ${wz.step} de 5 · ${WZ[wz.step - 1]}</div>${body}<div class="nav">${nav}</div></div>`;
}
const $ = id => document.getElementById(id);
function wzRender() {
  const s = wz.step, C = ctxData?.context;
  if (s === 1) {
    wzFrame(`<h2>Un juego nuevo</h2><p class="note">En ${esc(wz.info.folder)}. Kiln escribe aquí su kiln.toml y el contexto del juego; no toca nada más.</p>
      <label>Nombre del juego<input id="wzName" value="${esc(wz.name)}" placeholder="Puerto Niebla"></label>
      <dl><dt>Tipo</dt><dd>Juego (de momento, el único tipo)</dd><dt>Motor</dt><dd>Godot 4</dd></dl>`, `<button type="button" class="go" id="wzNext">Seguir</button>`);
    const go = () => { wz.name = $("wzName").value.trim(); if (wz.name) { wz.step = 2; wzRender(); } else $("wzName").focus(); };
    $("wzNext").onclick = go; $("wzName").onkeydown = e => { if (e.key === "Enter") go(); }; $("wzName").focus();
  } else if (s === 2) {
    wzFrame(`<h2>Lo básico</h2><p class="note">Cinco cosas que cualquier asset necesita saber. Elige una o escribe la tuya; puedes dejar alguna en blanco.</p>`
      + wz.info.basics.map(b => `<div class="qcard"><b>${esc(b.text)}</b><div class="opts">${b.options.map((o, i) => `<button type="button" data-b="${b.id}" data-i="${i}" class="${wz.basics[b.id] === o ? "on" : ""}">${esc(o)}</button>`).join("")}</div>
        <div class="free"><input data-free="${b.id}" placeholder="O con tus palabras" value="${esc(b.options.includes(wz.basics[b.id]) ? "" : wz.basics[b.id] ?? "")}"></div></div>`).join(""),
      `<button type="button" id="wzBack">Atrás</button><button type="button" class="go" id="wzMake">Crear el proyecto</button>`);
    wzEl.querySelectorAll("[data-b]").forEach(btn => btn.onclick = () => { const b = wz.info.basics.find(x => x.id === btn.dataset.b); wz.basics[b.id] = b.options[+btn.dataset.i]; wzRender(); });
    wzEl.querySelectorAll("[data-free]").forEach(inp => inp.oninput = () => { if (inp.value.trim()) wz.basics[inp.dataset.free] = inp.value.trim(); });
    $("wzBack").onclick = () => { wz.step = 1; wzRender(); };
    $("wzMake").onclick = async () => { const r = await post("/api/new", { name: wz.name, basics: wz.basics }); if (r.error) return wzError(r.error); wz.step = 3; start(); };
  } else if (s === 3) {
    wzFrame(`<h2>Tu juego, con tus palabras</h2><p class="note">De qué va, dónde y cuándo pasa, qué hace el jugador y cómo se ve. Si se parece a un juego que existe, dilo. El agente lo parte en afirmaciones por capa, escribe un párrafo de qué juego es y te hace preguntas.</p>
      <textarea id="wzText" placeholder="Un juego de...">${esc(C.text)}</textarea><div id="wzLog"></div>`,
      `<button type="button" class="go" id="wzSort">Ordenar y preguntar</button>`);
    $("wzSort").onclick = async () => {
      const text = $("wzText").value.trim(); if (!text) return $("wzText").focus();
      if (!(await wzPost("text", { text }))) return;
      $("wzSort").disabled = true; $("wzText").disabled = true;
      if (!(await wzJob("sort")) || !(await wzJob("refine"))) { $("wzSort").disabled = false; $("wzText").disabled = false; return; }
      start();
    };
  } else if (s === 4) {
    const qs = C.questions.filter(q => q.status === "open");
    if (!qs.length) { wz.step = 5; return wzRender(); }
    const q = qs[0];
    wzFrame(`<h2>Unas preguntas</h2><p class="note">Quedan ${qs.length}. Cada respuesta queda fijada en su capa: el agente no la cambia.</p>
      <div class="kind">${esc(layerName(q.layer))}</div>` + qcard(q) + `<div id="wzLog"></div>`,
      `<button type="button" id="wzMore">Otra ronda</button><button type="button" class="go" id="wzSkipAll">Seguir sin responder</button>`);
    const done = ok => ok && wzRender();
    wzEl.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => wzPost("answer", { id: q.id, answer: q.options[+b.dataset.opt], status: "answered" }).then(done));
    $("qSend").onclick = () => wzPost("answer", { id: q.id, answer: $("qFree").value, status: "answered" }).then(done);
    $("qFree").onkeydown = e => { if (e.key === "Enter") $("qSend").click(); };
    $("qSkip").onclick = () => wzPost("answer", { id: q.id, status: "skipped" }).then(done);
    $("qNa").onclick = () => wzPost("answer", { id: q.id, status: "not_applicable" }).then(done);
    $("wzMore").onclick = async () => { if (await wzJob("refine")) wzRender(); };
    $("wzSkipAll").onclick = () => { wz.step = 5; wzRender(); };
  } else {
    const I = C.intent || {}, missing = wz.info.missing || [];
    wzFrame(`<h2>Asentar el inicio</h2><p class="note">Esto es lo que todo asset leerá primero. Fija el párrafo y al menos una afirmación por capa.</p>
      <div class="kind">Qué juego es ${I.pinned ? `<span class="pill ok">fijado</span>` : ""}</div>
      <textarea id="wzIntent" style="min-height:110px">${esc(I.text)}</textarea>
      <div class="actions"><button type="button" id="wzPinI">Guardar y fijar el párrafo</button></div>
      ${I.proposed ? `<div class="proposal"><b>El agente propone:</b> ${esc(I.proposed)}<div class="actions"><button type="button" id="wzAcc">Aceptar</button><button type="button" id="wzRej">Descartar</button></div></div>` : ""}
      <div class="kind">Por capa</div>`
      + ctxData.layers.map(l => { const cs = C.claims.filter(c => c.layer === l.id);
        return `<div class="lrow"><b>${esc(l.name)} ${cs.some(c => c.pinned) ? `<span class="pill ok">fijada</span>` : `<span class="pill warn">nada fijado</span>`}</b>`
          + cs.map(c => `<div class="crow"><span>${c.conflicts ? `<span class="pill error">choca</span> ` : ""}${esc(c.text)}</span>${c.pinned ? `<span class="note">fijada</span>` : `<button type="button" data-pin="${esc(c.id)}">Fijar</button>`}${c.conflicts ? `<button type="button" data-del="${esc(c.id)}">Borrar</button>` : ""}</div>`).join("")
          + `<div class="free"><input data-add="${esc(l.id)}" placeholder="Añadir una afirmación a ${esc(l.name)}"></div></div>`; }).join("")
      + (missing.length ? `<div class="finding"><b>Falta:</b> ${missing.map(esc).join(" · ")}</div>` : `<p class="note">Todo listo.</p>`),
      `<button type="button" id="wzQs">Más preguntas</button><button type="button" class="go" id="wzSettle"${missing.length ? " disabled" : ""}>Asentar y abrir el proyecto</button>`);
    const again = ok => ok && start();
    $("wzPinI").onclick = () => wzPost("intent", { action: "edit", text: $("wzIntent").value }).then(again);
    $("wzAcc")?.addEventListener("click", () => wzPost("intent", { action: "accept" }).then(again));
    $("wzRej")?.addEventListener("click", () => wzPost("intent", { action: "reject" }).then(again));
    wzEl.querySelectorAll("[data-pin]").forEach(b => b.onclick = () => wzPost("claim", { id: b.dataset.pin, action: "pin" }).then(again));
    wzEl.querySelectorAll("[data-del]").forEach(b => b.onclick = () => wzPost("claim", { id: b.dataset.del, action: "delete" }).then(again));
    wzEl.querySelectorAll("[data-add]").forEach(inp => inp.onkeydown = e => { if (e.key === "Enter" && inp.value.trim()) wzPost("claim", { action: "add", layer: inp.dataset.add, text: inp.value }).then(again); });
    $("wzQs").onclick = async () => { if (await wzJob("refine")) { wz.step = 4; start(); } };
    $("wzSettle").onclick = async () => { const r = await post("/api/settle", {}); if (r.error) return wzError(r.error);
      document.querySelectorAll("header > *").forEach(e => e.hidden = e.id === "back"); document.getElementById("crumbs").hidden = false; start(); };
  }
}
async function wzPost(what, body) { const r = await post("/api/context/" + what, body); if (r.error) { wzError(r.error); return false; } ctxData = await (await fetch("/api/context")).json(); return true; }
function wzError(e) { wzEl.querySelector(".nav").insertAdjacentHTML("beforebegin", `<div class="finding error">${esc(e)}</div>`); }
async function wzJob(what) {
  const r = await post("/api/context/" + what, {}); if (r.error) { wzError(r.error); return false; }
  const box = $("wzLog") || wzEl.querySelector(".wz");
  for (;;) {
    const j = await (await fetch("/api/jobs/" + r.job)).json();
    box.innerHTML = `<div class="kind">${j.status === "running" ? "El agente trabaja" : j.status === "done" ? "Hecho" : "Falló"} · ${esc(j.asked)}</div>` + j.log.map(l => `<div class="log">${esc(l)}</div>`).join("");
    if (j.status !== "running") { ctxData = await (await fetch("/api/context")).json(); return j.status === "done"; }
    await new Promise(ok => setTimeout(ok, 1500));
  }
}
start();
</script>
