<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln · maqueta</title>
<style>
/* =========================================================================
   KILN · MAQUETA K003  (solo para aprobar; no es codigo de produccion)
   Identidad visual: paleta, tipografias y tono de la interfaz actual.
   Cambia la jerarquia: barra superior, navegacion lateral, zona de trabajo,
   panel de detalle plegable.
   ========================================================================= */

/* ---- 1. Tokens: color (dos temas), espaciado, tipografia ---------------- */
:root {
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r1: 6px; --r2: 10px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Menlo, monospace;
  --topbar: 52px; --nav: 216px; --detail: 340px;
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #eef0ec; --panel: #ffffff; --panel2: #f6f7f4; --fg: #1d221c; --muted: #5d6658;
  --line: #c5cbbf; --line2: #dfe3da; --line-ui: #7d8678; --accent: #b4561f; --accent-text: #9a4415; --accent-fg: #ffffff; --accent-soft: #f6e4d8;
  --ok: #2f6b2c; --okbg: #e3efdf; --warn: #855600; --warnbg: #f7ecd2; --bad: #a3322a; --badbg: #f6e0dc;
  --info: #2a567f; --infobg: #dde8f2; --shadow: 0 8px 28px rgb(29 34 28 / .18);
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #161a15; --panel: #1f241e; --panel2: #1a1f19; --fg: #e6eae2; --muted: #9aa393;
  --line: #3a4237; --line2: #2c332a; --line-ui: #6b7667; --accent: #e08a4e; --accent-text: #e08a4e; --accent-fg: #161a15; --accent-soft: #3a2a1d;
  --ok: #8cc887; --okbg: #22331f; --warn: #e2b04f; --warnbg: #3a2f17; --bad: #ec8476; --badbg: #3d221e;
  --info: #8ab8e2; --infobg: #1d2b38; --shadow: 0 8px 28px rgb(0 0 0 / .5);
}

/* ---- 2. Base ------------------------------------------------------------ */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); font-variant-numeric: tabular-nums; overflow: hidden; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--accent-text); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
code, kbd, .mono { font-family: var(--mono); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.grow { flex: 1; }
kbd { font: 500 11px var(--mono); padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); background: var(--panel2); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- 3. Controles ------------------------------------------------------- */
.btn { position: relative; font: 600 13px var(--font); padding: 6px 12px; border-radius: var(--r1); border: 1px solid var(--line-ui); background: var(--panel); color: var(--fg); cursor: pointer; white-space: nowrap; line-height: 1.4; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.sm { font-size: 12px; padding: 3px 9px; }
.btn[aria-disabled="true"] { opacity: .62; cursor: not-allowed; border-style: dashed; }
.btn[aria-disabled="true"]:hover { border-color: var(--line-ui); filter: none; }
.btn[data-tip]::after { content: attr(data-tip); position: absolute; z-index: 60; top: calc(100% + 6px); left: 0; width: 250px; padding: var(--s2) var(--s3); border-radius: var(--r1); background: var(--fg); color: var(--bg); font: 500 12px/1.4 var(--font); white-space: normal; text-align: left; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transform: translateY(-2px); transition: opacity .12s, transform .12s; }
.btn[data-tip][data-tip-align="right"]::after { left: auto; right: 0; }
.btn[data-tip]:hover::after, .btn[data-tip]:focus-visible::after { opacity: 1; transform: none; }
.iconbtn { border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; border-radius: var(--r1); font: 400 20px/1 var(--font); cursor: pointer; flex: none; }
.iconbtn:hover { background: var(--line2); color: var(--fg); }
.field { font: inherit; padding: 6px 10px; border: 1px solid var(--line-ui); border-radius: var(--r1); background: var(--panel); color: var(--fg); min-width: 0; }
.field::placeholder { color: var(--muted); }
.field:focus-visible { outline-offset: 0; border-color: var(--accent); }

/* severidad: forma + color (no depende solo del color) */
.dot { display: inline-block; width: 9px; height: 9px; flex: none; }
.dot.error { background: var(--bad); border-radius: 50%; }
.dot.warn { background: var(--warn); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.dot.info { border: 2px solid var(--info); border-radius: 50%; }
.dot.ok { background: var(--ok); border-radius: 50%; }
.dot.busy { border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
.dot.none { visibility: hidden; }
.sev { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.sev.error { color: var(--bad); } .sev.warn { color: var(--warn); } .sev.info { color: var(--info); } .sev.ok { color: var(--ok); }
.tag { font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--font); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line-ui); background: var(--panel); color: var(--fg); cursor: pointer; }
.chip b { font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip[aria-pressed="true"] b { color: var(--fg); }
.meter { height: 6px; border-radius: 3px; background: var(--line2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter.bad i { background: var(--bad); }
.meter.ok i { background: var(--ok); }

/* ---- 4. Armazon: barra superior, navegacion, trabajo, detalle ----------- */
.app { display: grid; grid-template-rows: var(--topbar) minmax(0, 1fr); height: 100vh; height: 100dvh; }
.topbar { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4); background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 40; }
.brand { display: flex; align-items: center; gap: var(--s2); width: calc(var(--nav) - var(--s4)); flex: none; }
.brand strong { font-size: 18px; letter-spacing: -.01em; }
.mark { width: 16px; height: 16px; border-radius: 4px; background: var(--accent); box-shadow: inset 0 -6px 0 rgb(0 0 0 / .18); }
.search { position: relative; flex: 0 1 460px; min-width: 140px; }
.search .field { width: 100%; padding-right: 36px; }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.sres { position: absolute; top: calc(100% + 6px); left: 0; width: max(100%, 480px); max-height: min(70vh, 520px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); box-shadow: var(--shadow); padding: var(--s2); z-index: 50; }
.sres h3, .pal h3 { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: var(--s2) var(--s2) var(--s1); }
.opt { display: flex; align-items: baseline; gap: var(--s3); padding: 6px var(--s2); border-radius: var(--r1); cursor: pointer; font-size: 13px; }
.opt .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .t.mono { font-size: 12.5px; }
.opt .h { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; padding-left: var(--s3); }
.opt[aria-selected="true"], .opt:hover { background: var(--accent-soft); }
.opt[aria-disabled="true"] { opacity: .6; }
mark { background: transparent; color: inherit; font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 2px; }
.sfoot { border-top: 1px solid var(--line2); margin-top: var(--s2); padding: var(--s2) var(--s2) var(--s1); font-size: 12px; color: var(--muted); }
.status { display: flex; align-items: center; gap: var(--s2); font-size: 12.5px; color: var(--muted); min-width: 0; padding: 0 var(--s2); }
.status a { color: var(--fg); font-weight: 600; text-decoration: none; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--accent); display: inline-flex; align-items: center; gap: var(--s2); min-width: 0; }
.status a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status .idle { display: inline-flex; align-items: center; gap: var(--s2); white-space: nowrap; }

.shell { display: grid; grid-template-columns: var(--nav) minmax(0, 1fr); min-height: 0; }
.shell.with-detail { grid-template-columns: var(--nav) minmax(0, 1fr) var(--detail); }
nav.side { padding: var(--s4) var(--s3); display: flex; flex-direction: column; gap: var(--s1); overflow: auto; border-right: 1px solid var(--line2); }
nav.side h2 { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: var(--s4) var(--s3) var(--s1); }
nav.side h2:first-child { display: none; }
nav.side a { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: var(--s2); padding: 7px var(--s3); border-radius: var(--r1); color: var(--fg); text-decoration: none; font-weight: 500; }
nav.side a:hover { background: var(--panel); }
nav.side a[aria-current="page"] { background: var(--panel); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent), 0 0 0 1px var(--line2); }
nav.side .cnt { font: 500 12px var(--mono); color: var(--muted); }
nav.side .hint { margin-top: auto; margin-bottom: 40px; padding: var(--s3); font-size: 12px; color: var(--muted); line-height: 1.7; }
.work { overflow: auto; padding: var(--s5); min-width: 0; }
.work:focus { outline: none; }
#detail { display: none; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; }
.with-detail #detail { display: block; }

.page { display: flex; flex-direction: column; gap: var(--s5); max-width: 1180px; }
.page.fill { height: 100%; gap: var(--s4); max-width: none; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; }
.pagehead h1 { font-size: 20px; line-height: 1.25; letter-spacing: -.01em; }
.pagehead .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.sec { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: var(--s2); display: flex; align-items: center; gap: var(--s2); }
.sec .n { font-weight: 500; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); font-size: 13px; color: var(--muted); }
.crumbs a { color: var(--fg); }
.crumbs li + li::before { content: "/"; margin-right: var(--s2); color: var(--line); }
.crumbs [aria-current] { font-weight: 600; color: var(--fg); }

/* ---- 5. Inicio ---------------------------------------------------------- */
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--s5); align-items: start; }
.home-grid > div { display: flex; flex-direction: column; gap: var(--s5); min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s3); }
.tile { display: block; text-decoration: none; color: var(--fg); padding: var(--s3) var(--s4); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); }
.tile:hover { border-color: var(--accent); }
.tile .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; }
.tile .l { font-size: 13px; font-weight: 600; }
.tile .d { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.zero .v { color: var(--muted); }
.issues { overflow: hidden; }
.issues .gh { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line2); background: var(--panel2); }
.issues .gh .t { font-weight: 600; }
.issues .gh a { margin-left: auto; font-size: 12.5px; font-weight: 600; }
.issues li + li { border-top: 1px solid var(--line2); }
.issues .gh:not(:first-child) { border-top: 1px solid var(--line); }
.issue { display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr) 130px; gap: var(--s3); align-items: baseline; padding: 7px var(--s4); color: var(--fg); text-decoration: none; font-size: 13px; }
.issue:hover { background: var(--accent-soft); }
.issue .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.issue .w { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.issue .mono { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.calm { display: flex; gap: var(--s4); align-items: center; padding: var(--s5); background: var(--okbg); border: 1px solid var(--ok); border-radius: var(--r2); color: var(--fg); }
.calm svg { width: 28px; height: 28px; color: var(--ok); flex: none; }
.calm b { display: block; font-size: 15px; }
.calm span { color: var(--muted); font-size: 13px; }
.next { padding: var(--s4); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); display: flex; flex-direction: column; gap: var(--s3); }
.next h3 { font-size: 16px; line-height: 1.3; }
.next p { color: var(--muted); font-size: 13px; }
.next .row { display: flex; gap: var(--s2); flex-wrap: wrap; }
.jobmini { padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
.jobmini .top { display: flex; justify-content: space-between; gap: var(--s3); font-size: 13px; }
.joblist li + li { border-top: 1px solid var(--line2); }
.joblist a { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4); color: var(--fg); text-decoration: none; font-size: 13px; }
.joblist a:hover { background: var(--accent-soft); }
.joblist .when { margin-left: auto; color: var(--muted); font-size: 12px; }

/* ---- 6. Estados vacios -------------------------------------------------- */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s3); padding: var(--s6) var(--s5); border: 1px dashed var(--line); border-radius: var(--r2); background: var(--panel2); }
.empty svg { width: 32px; height: 32px; color: var(--muted); }
.empty h3 { font-size: 16px; }
.empty p { color: var(--muted); font-size: 13px; max-width: 460px; }
.empty ol { text-align: left; font-size: 13px; counter-reset: s; display: flex; flex-direction: column; gap: var(--s2); }
.empty ol li { counter-increment: s; padding-left: 28px; position: relative; }
.empty ol li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--line2); text-align: center; font: 600 11px/20px var(--mono); }
.empty.small { padding: var(--s5) var(--s4); border: 0; background: transparent; }

/* ---- 7. Listas con dos columnas, barra de herramientas, tabla virtual --- */
.split { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--s4); flex: 1; min-height: 0; }
.sidelist { overflow: auto; padding: var(--s2); }
.sidelist h2 { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: var(--s2) var(--s2) var(--s1); }
.sidelist a { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: var(--s2); padding: 6px var(--s2); border-radius: var(--r1); color: var(--fg); text-decoration: none; font-size: 13px; }
.sidelist a:hover { background: var(--panel2); }
.sidelist a[aria-current="true"] { background: var(--accent-soft); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.sidelist a > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidelist .cnt { font: 500 12px var(--mono); color: var(--muted); }
.sidelist hr { border: 0; border-top: 1px solid var(--line2); margin: var(--s2) 0; }
.pane { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.toolbar .field { flex: 0 1 260px; }
.toolbar .count { font-size: 13px; color: var(--muted); white-space: nowrap; }
.toolbar .count b { color: var(--fg); }
.chips { display: flex; gap: var(--s2); flex-wrap: wrap; }
.vgrid { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); overflow: hidden; --cols: 1fr; }
.vgrid:focus-visible { outline-offset: -2px; }
.vh { display: grid; grid-template-columns: var(--cols); align-items: center; gap: var(--s3); padding: 0 var(--s4); height: 34px; border-bottom: 1px solid var(--line); background: var(--panel2); flex: none; }
.vh > div { min-width: 0; display: flex; }
.vh > .r { justify-content: flex-end; }
.hbtn { all: unset; cursor: pointer; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; white-space: nowrap; }
.hbtn:hover, .hbtn[data-on] { color: var(--fg); }
.hbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hbtn .arr { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 5px solid currentColor; opacity: 0; }
.hbtn[data-on] .arr { opacity: 1; }
.hbtn[data-dir="-1"] .arr { transform: rotate(180deg); }
.vb { flex: 1; overflow: auto; position: relative; }
.vs { position: relative; }
.vr { position: absolute; left: 0; right: 0; top: 0; }
.vrow { display: grid; grid-template-columns: var(--cols); align-items: center; gap: var(--s3); padding: 0 var(--s4); border-bottom: 1px solid var(--line2); font-size: 13px; cursor: pointer; }
.vrow:hover { background: var(--panel2); }
.vrow.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.vrow.act { outline: 2px solid var(--accent); outline-offset: -2px; }
.vgrid:not(:focus-within) .vrow.act { outline: 0; }
.vc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vc.r { text-align: right; }
.vc.mono { font-size: 12.5px; }
.vc.bad { color: var(--bad); font-weight: 600; }
.vfoot { flex: none; padding: 5px var(--s4); border-top: 1px solid var(--line); background: var(--panel2); font: 500 11.5px var(--mono); color: var(--muted); display: flex; justify-content: space-between; gap: var(--s3); }
.vnone { padding: var(--s6) var(--s4); }

/* ---- 8. Arbol (esquema plegable) --------------------------------------- */
.tree { overflow: auto; padding: var(--s2); flex: 1; min-height: 0; }
.trow { display: grid; grid-template-columns: 20px 78px minmax(0, 1fr) auto auto; align-items: center; gap: var(--s2); padding: 0 var(--s3); height: 34px; border-radius: var(--r1); cursor: pointer; font-size: 13.5px; }
.trow:hover { background: var(--panel2); }
.trow[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.trow .tw { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.trow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.trow[aria-level="1"] .nm, .trow[aria-level="2"] .nm { font-weight: 650; }
.trow .kd { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.trow .ct { font: 500 12px var(--mono); color: var(--muted); text-align: right; min-width: 78px; }
.trow .sv { min-width: 74px; display: flex; justify-content: flex-end; }
.chev { all: unset; width: 20px; height: 20px; display: grid; place-items: center; cursor: pointer; border-radius: 4px; }
.chev:hover { background: var(--line2); }
.chev::before { content: ""; width: 6px; height: 6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .12s; }
.trow[aria-expanded="true"] .chev::before { transform: rotate(45deg); }
.trow:not([aria-expanded]) .chev { visibility: hidden; }
.tree-guides .trow { position: relative; }

/* ---- 9. Contexto -------------------------------------------------------- */
.ctx { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: var(--s5); align-items: start; }
.layers { display: flex; flex-direction: column; gap: var(--s4); }
.layer .lh { display: flex; align-items: baseline; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line2); }
.layer .lh h3 { font-size: 15px; }
.layer .lh span { margin-left: auto; font-size: 12px; color: var(--muted); }

const BASE = (function build() {
  /* kits */
  const kits = KIT_DEFS.map(d => ({ id: d[0], name: d[1], short: d[2], place: d[3], n: d[4], nouns: d[5], desc: d[6] }));

  /* materiales (40) */
  const materials = MAT_NAMES.map((n, i) => ({
    id: n, name: n, type: i === 14 || i === 15 ? 'Translúcido' : i === 36 ? 'Agua' : i === 22 || i === 23 ? 'Vegetación' : i === 33 ? 'Emisivo' : 'Estándar',
    tex: pick([512, 1024, 1024, 2048, 2048]), mips: true, uses: 0, kits: new Set()
  }));

  /* piezas (~3.000) */
  const pieces = [];
  for (const k of kits) {
    const ki = KIT_DEFS.findIndex(d => d[0] === k.id); const prefer = materials.filter((m, i) => i < 35 && (i + 5 * ki) % 3 === 0);
    for (let i = 0; i < k.n; i++) {
      const noun = k.nouns[i % k.nouns.length];
      const name = `${k.short}_${noun}_${pad2(Math.floor(i / k.nouns.length) + 1)}`;
      const mat = pick(prefer);
      pieces.push({
        id: name, name, kit: k.id, noun, material: mat.id, tris: Math.round(120 + Math.pow(R(), 2.1) * 5400),
        kb: Math.round(14 + R() * R() * 760), tex: mat.tex, variants: Math.floor(R() * R() * 4), mod: `2026-11-${pad2(1 + Math.floor(R() * 14))}`
      });
      mat.uses++; mat.kits.add(k.id);
    }
  }

  /* hallazgos (~600) */
  const findings = []; let fid = 1;
  const HINT = {
    'tris-excedido': 'Reduce la malla o divídela en dos piezas; el presupuesto es de 6.000 triángulos.',
    'material-ausente': 'Declara el material en materials/ o cambia la referencia de la pieza.',
    'malla-abierta': 'Cierra las aristas abiertas en el editor 3D y vuelve a exportar.',
    'textura-no-potencia-2': 'Reescala la textura a una potencia de 2 (512, 1024, 2048).',
    'escala-sospechosa': 'Comprueba que la pieza está en metros; parece fuera de proporción.',
    'pivote-descentrado': 'Coloca el pivote en la base de la pieza antes de exportar.',
    'lod-ausente': 'Añade al menos un nivel de detalle inferior.',
    'nombre-no-convencional': 'Renombra siguiendo kit_objeto_nn.',
    'sin-variantes': 'Opcional: crea una variante para evitar repeticiones visibles.',
    'uv2-ausente': 'Genera el segundo canal UV si la pieza recibe luz horneada.',
    'sin-mipmaps': 'Activa la generación de mipmaps en el material.',
    'material-sin-usar': 'Ninguna pieza lo usa; elimínalo o asígnalo.',
    'nombre-duplicado': 'Dos materiales comparten nombre normalizado; renombra uno.',
    'referencia-rota': 'Corrige el identificador o crea el elemento referenciado.',
    'campo-vacio': 'Rellena el campo obligatorio.',
    'texto-largo': 'El texto supera 240 caracteres; considera dividirlo.'
  };
  const pickWeighted = (kitBoost) => { const pool = []; kits.forEach(k => { for (let j = 0; j < (k.id === kitBoost ? 4 : 1); j++) pool.push(k.id); }); return pick(pool); };
  const piecesByKit = new Map(kits.map(k => [k.id, pieces.filter(p => p.kit === k.id)]));
  const addP = (sev, code, msgFn, boost, count, tag) => {
    for (let i = 0; i < count; i++) {
      const p = pick(piecesByKit.get(pickWeighted(boost)));
      if (code === 'tris-excedido') p.tris = 6100 + Math.round(R() * 3600);
      if (code === 'material-ausente') p.material = pick(['cristal_taberna', 'madera_astillero', 'pintura_faro', 'lona_nueva']);
      findings.push({ id: 'f' + fid++, sev, code, type: 'piece', subj: p.id, kit: p.kit, msg: msgFn(p), hint: HINT[code] });
    }
  };
  addP('error', 'tris-excedido', p => `Supera el presupuesto: ${fmt(p.tris)} triángulos (máximo 6.000).`, 'astillero', 20);
  addP('error', 'material-ausente', p => `El material «${p.material}» no existe en el proyecto.`, 'astillero', 13);
  addP('error', 'malla-abierta', p => `Malla con ${2 + Math.floor(R() * 14)} aristas abiertas.`, 'astillero', 13);
  addP('warn', 'textura-no-potencia-2', p => `La textura base mide ${pick([600, 1000, 1500, 3000])} px: no es potencia de 2.`, 'casas', 66);
  addP('warn', 'escala-sospechosa', p => `Escala ×${(R() * 9 + 1.5).toFixed(1)} respecto a la media de «${p.noun}».`, 'callejones', 58);
  addP('warn', 'pivote-descentrado', p => 'El pivote está a más de 40 cm de la base.', 'muelle-viejo', 45);
  addP('warn', 'lod-ausente', p => 'Sin nivel de detalle inferior declarado.', 'vegetacion', 22);
  addP('info', 'nombre-no-convencional', p => `El nombre «${p.name}» no sigue el patrón kit_objeto_nn.`, 'props-portuarios', 125);
  addP('info', 'sin-variantes', p => 'Pieza sin variantes; se repetirá igual en escena.', 'casas', 125);
  addP('info', 'uv2-ausente', p => 'Sin segundo canal UV para luz horneada.', 'faro', 82);
  /* materiales: 22 hallazgos */
  const used = materials.slice().sort(() => R() - .5);
  used.filter(m => m.uses > 0).slice(0, 14).forEach((m, i) => { if (i < 14) findings.push({ id: 'f' + fid++, sev: 'warn', code: i < 9 ? 'sin-mipmaps' : 'nombre-duplicado', type: 'material', subj: m.id, msg: i < 9 ? `La textura de ${m.tex} px no tiene mipmaps.` : `Nombre muy parecido a otro material.`, hint: HINT[i < 9 ? 'sin-mipmaps' : 'nombre-duplicado'] }); });
  materials.filter(m => m.uses === 0).forEach(m => findings.push({ id: 'f' + fid++, sev: 'info', code: 'material-sin-usar', type: 'material', subj: m.id, msg: 'Declarado, pero ninguna pieza lo usa todavía.', hint: HINT['material-sin-usar'] }));
  materials.filter(m => m.uses > 0 && m.tex === 2048).slice(0, 8 - materials.filter(m => m.uses === 0).length).forEach(m => findings.push({ id: 'f' + fid++, sev: 'info', code: 'textura-grande', type: 'material', subj: m.id, msg: 'Textura de 2048 px: comprueba si hace falta tanta resolución.', hint: 'Reduce a 1024 px si cubre poco espacio en pantalla.' }));

  /* contenido: 1 conjunto, 4 tipos, 120 elementos */
  const KINDS = [
    { id: 'mision', name: 'Misión', n: 24 }, { id: 'personaje', name: 'Personaje', n: 30 },
    { id: 'objeto', name: 'Objeto', n: 36 }, { id: 'dialogo', name: 'Diálogo', n: 30 }
  ];
  const zonas = ['Muelle', 'Faro', 'Astillero', 'Mercado', 'Callejón', 'Acantilado'];
  const elements = [];
  const A = ['Rumores del', 'Deuda en el', 'Sombras sobre el', 'Carta para el', 'Contrabando en el', 'Última marea en el'];
  const T1 = ['Capitán', 'Vieja', 'Joven', 'Maese', 'Tía', 'Contramaestre'], T2 = ['Bruma', 'Casilda', 'Ruperto', 'Olalla', 'Tomeu', 'Nereo', 'Salitre', 'Marea', 'Quilla', 'Sorda'];
  const O1 = ['Llave', 'Brújula', 'Farol', 'Cuaderno', 'Cuerda', 'Mapa', 'Amuleto', 'Sextante', 'Anzuelo', 'Botella'], O2 = ['oxidada', 'empapada', 'del capitán', 'sin nombre', 'de latón', 'heredada'];
  const D1 = ['Taberna', 'Muelle', 'Faro', 'Mercado', 'Astillero', 'Callejón'], D2 = ['saludo', 'amenaza', 'rumor', 'despedida', 'trato'];
  const slug = s => norm(s).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  const mk = (kind, i, title, detail, refs) => elements.push({ id: `${kind}.${slug(title)}`, kind, title, detail, refs, i });
  for (let i = 0; i < 24; i++) mk('mision', i, `${A[i % 6]} ${['muelle', 'faro', 'astillero', 'mercado', 'callejón', 'acantilado'][Math.floor(i / 6) % 6]}${i >= 6 && i % 6 === 5 ? ' (II)' : ''}`, `Zona: ${zonas[i % 6]} · ${3 + (i % 5)} pasos`, 2 + (i % 4));
  for (let i = 0; i < 30; i++) mk('personaje', i, `${T1[i % 6]} ${T2[Math.floor(i / 6) * 2 % 10]}${i % 2 ? '' : ''}`, `Rol: ${pick(['pescador', 'tabernero', 'cartógrafo', 'contrabandista', 'vigía'])} · ${zonas[(i + 2) % 6]}`, 1 + (i % 3));
  for (let i = 0; i < 36; i++) mk('objeto', i, `${O1[i % 10]} ${O2[Math.floor(i / 10) + (i % 2)]}`.replace(/ $/, ''), `Tipo: ${pick(['clave', 'consumible', 'ornamento'])} · ${(R() * 3 + .1).toFixed(1)} kg`, i % 3);
  for (let i = 0; i < 30; i++) mk('dialogo', i, `${D1[i % 6]}: ${D2[Math.floor(i / 6)]}`, `Personaje: ${T1[i % 6]} ${T2[(i * 3) % 10]} · ${4 + (i % 9)} nodos`, 1 + (i % 2));
  /* ids únicos */
  const seen = new Set(); elements.forEach(e => { let b = e.id, n = 2; while (seen.has(e.id)) e.id = b + '_' + n++; seen.add(e.id); });
  const mkF = (el, sev, code, msg) => findings.push({ id: 'f' + fid++, sev, code, type: 'element', subj: el.id, kind: el.kind, msg, hint: HINT[code] });
  const E = k => elements.filter(e => e.kind === k);
  mkF(E('mision')[3], 'error', 'referencia-rota', 'Referencia a «personaje.maese_salitre» que no existe.');
  mkF(E('mision')[11], 'error', 'referencia-rota', 'Referencia a «objeto.llave_del_faro» que no existe.');
  mkF(E('personaje')[7], 'warn', 'campo-vacio', 'El campo «zona» está vacío.');
  mkF(E('personaje')[18], 'warn', 'campo-vacio', 'El campo «rol» está vacío.');
  mkF(E('objeto')[5], 'warn', 'campo-vacio', 'El campo «peso» está vacío.');
  mkF(E('dialogo')[2], 'warn', 'texto-largo', 'El nodo 6 tiene 312 caracteres.');
  mkF(E('dialogo')[14], 'warn', 'texto-largo', 'El nodo 3 tiene 268 caracteres.');
  mkF(E('objeto')[20], 'info', 'campo-vacio', 'Sin descripción corta para la ficha.');
  mkF(E('dialogo')[25], 'info', 'texto-largo', 'El nodo 9 tiene 241 caracteres.');

  /* contexto: capas, afirmaciones, preguntas */
  const layers = [
    { id: 'vision', name: 'Visión del juego', claims: [
      ['c1', 'Aventura narrativa en un puerto costero, ritmo pausado.', 'set', 'context/vision.md:3'],
      ['c2', 'Cámara en tercera persona fija, sin combate.', 'set', 'context/vision.md:7'],
      ['c3', 'Duración objetivo de la partida: 6 a 8 horas.', 'open', 'context/vision.md:12']] },
    { id: 'estilo', name: 'Estilo visual', claims: [
      ['c4', 'Paleta desaturada con acentos cálidos.', 'set', 'context/estilo.md:2'],
      ['c5', 'Low-poly con texturas pintadas a mano.', 'set', 'context/estilo.md:5'],
      ['c6', 'Presupuesto: 6.000 triángulos por pieza de entorno.', 'set', 'context/estilo.md:9'],
      ['c7', 'Niebla volumétrica en todos los exteriores.', 'open', 'context/estilo.md:14']] },
    { id: 'mundo', name: 'Mundo y lugares', claims: [
      ['c8', 'Tres zonas: Puerto, Casco antiguo y Costa.', 'set', 'context/mundo.md:1'],
      ['c9', 'El faro es el punto final de la historia.', 'open', 'context/mundo.md:6'],
      ['c10', 'Ciclo de día y noche con tres franjas.', 'open', 'context/mundo.md:11']] },
    { id: 'tecnico', name: 'Técnico', claims: [
      ['c11', 'Unidades en metros, eje Y hacia arriba.', 'set', 'context/tecnico.md:1'],
      ['c12', 'Texturas en potencias de 2, máximo 2048 px.', 'set', 'context/tecnico.md:4'],
      ['c13', 'Exportación a glTF 2.0.', 'set', 'context/tecnico.md:8']] }
  ].map(l => ({ id: l.id, name: l.name, claims: l.claims.map(c => ({ id: c[0], text: c[1], state: c[2], src: c[3], layer: l.id })) }));
  const questions = [
    { id: 'q1', text: '¿El ciclo de día y noche cambia los materiales o solo la iluminación?', opts: ['Solo la iluminación', 'También los materiales emisivos', 'Aún no lo sé'], claim: 'c10' },
    { id: 'q2', text: '¿La niebla se hornea en las texturas o es un efecto del motor?', opts: ['Efecto del motor', 'Horneada en texturas'], claim: 'c7' },
    { id: 'q3', text: '¿Cuántas horas debe durar la partida completa?', opts: ['6 horas', '8 horas', 'Sin límite'], claim: 'c3' }
  ];
  return { kits, materials, pieces, findings, KINDS, elements, layers, questions, piecesByKit };
})();

/* ---- 2b. Variante de proyecto: indices calculados una sola vez ---------- */
let DB = null;
function buildDB(variant) {
  const empty = variant === 'empty', clean = variant === 'clean';
  const findings = (empty || clean) ? [] : BASE.findings;
  const fBy = { piece: new Map(), material: new Map(), element: new Map() };
  const bySev = { error: [], warn: [], info: [] };
  for (const f of findings) {
    const m = fBy[f.type]; (m.get(f.subj) || m.set(f.subj, []).get(f.subj)).push(f);
    bySev[f.sev].push(f);
  }
  const sevOf = (type, id) => (fBy[type].get(id) || []).reduce((s, f) => worst(s, f.sev), '');
  const pieces = empty ? [] : BASE.pieces.map(p => { const fl = fBy.piece.get(p.id) || []; return Object.assign({}, p, { sev: sevOf('piece', p.id), nf: fl.length, k: p.name + ' ' + p.material }); });
  const materials = empty ? [] : BASE.materials.map(m => ({ id: m.id, name: m.name, type: m.type, tex: m.tex, uses: m.uses, nk: m.kits.size, kits: [...m.kits], sev: sevOf('material', m.id), nf: (fBy.material.get(m.id) || []).length }));
  const elements = empty ? [] : BASE.elements.map(e => ({ ...e, sev: sevOf('element', e.id), nf: (fBy.element.get(e.id) || []).length }));
  const kits = empty ? [] : BASE.kits.map(k => {
    const ps = pieces.filter(p => p.kit === k.id);
    const c = { error: 0, warn: 0, info: 0 }; findings.forEach(f => { if (f.kit === k.id) c[f.sev]++; });
    return { ...k, count: ps.length, sev: c.error ? 'error' : c.warn ? 'warn' : c.info ? 'info' : '', c };
  });
  const db = {
    variant, empty, clean, findings, bySev, fBy, pieces, materials, elements, kits,
    kitById: new Map(kits.map(k => [k.id, k])), pieceById: new Map(pieces.map(p => [p.id, p])),
    matById: new Map(materials.map(m => [m.id, m])), elById: new Map(elements.map(e => [e.id, e])),
    piecesByKit: new Map(kits.map(k => [k.id, pieces.filter(p => p.kit === k.id)])),
    kinds: empty ? [] : BASE.KINDS.map(k => { const es = elements.filter(e => e.kind === k.id); return { ...k, count: es.length, sev: es.reduce((s, e) => worst(s, e.sev), '') }; }),
    layers: empty ? [] : BASE.layers.map(l => ({ ...l, claims: l.claims.map(c => ({ ...c })) })),
    questions: empty ? [] : BASE.questions.map(q => ({ ...q, answer: null })),
    reading: false, jobs: []
  };
  db.claimById = new Map(db.layers.flatMap(l => l.claims).map(c => [c.id, c]));
  db.kindById = new Map(db.kinds.map(k => [k.id, k]));
  const badKit = kits.slice().sort((a, b) => b.c.error - a.c.error)[0];
  db.badKit = badKit && badKit.c.error ? badKit : null;
  return db;
}

/* =========================================================================
   3. Trabajos simulados (sin servidor): un trabajo en curso que avanza
   ========================================================================= */
const JOBS = { timer: null, subs: new Set(), seq: 3 };
function genLog(n, kitId = 'astillero') {
  const r = rng(77), out = []; const ps = BASE.piecesByKit.get(kitId);
  out.push({ t: clockStr(0), lvl: 'info', msg: `Leyendo kit.toml de «${kitId}»` });
  out.push({ t: clockStr(1), lvl: 'info', msg: `${ps.length} piezas declaradas` });
  out.push({ t: clockStr(2), lvl: 'info', msg: 'Comprobando texturas en potencias de 2' });
  for (let i = 3; i < n; i++) {
    const p = ps[Math.floor(r() * ps.length)], x = r();
    if (x < .1) out.push({ t: clockStr(i), lvl: 'warn', msg: `${p.name}: sin nivel de detalle inferior, se usa la malla completa` });
    else if (x < .22) out.push({ t: clockStr(i), lvl: 'info', msg: `Atlas ${Math.floor(i / 14) + 1}/6 compilado (2048×2048)` });
    else out.push({ t: clockStr(i), lvl: 'info', msg: `Optimizando ${p.name} (${fmt(Math.round(300 + r() * 5000))} → ${fmt(Math.round(200 + r() * 3000))} triángulos)` });
  }
  return out;
}
function makeJobs(variant) {
  const done = { id: 'j2', name: 'Validar contenido', cmd: 'kiln validate --content', status: 'done', pct: 100, start: '14:12', dur: '1 min 12 s', out: 'out/validacion.json', log: doneLog(variant), summary: variant === 'clean' ? { a: 120, b: 0, c: 0 } : { a: 120, b: 9, c: 2 } };
  if (variant === 'empty') return [];
  if (variant === 'clean') return [done];
  const failed = { id: 'j1', name: 'Exportar kit Faro a glTF', cmd: 'kiln export --kit faro --format gltf', status: 'failed', pct: 41, start: '13:48', dur: '34 s', log: genLog(26, 'faro').concat([{ t: clockStr(26), lvl: 'error', msg: 'No se puede escribir out/faro/faro_lente_01.glb' }, { t: clockStr(27), lvl: 'error', msg: 'El material «cristal_sucio» no tiene textura base' }]), err: 'No se puede escribir out/faro/faro_lente_01.glb: el material «cristal_sucio» no tiene textura base.', next: ['Abre la pieza faro_lente_01 y asigna una textura base al material «cristal_sucio».', 'Si el material debe ser translúcido, marca «sin textura» en su ficha.', 'Vuelve a lanzar la exportación.'] };
  const running = { id: 'j3', name: 'Construir kit Astillero', cmd: 'kiln build --kit astillero', status: 'running', pct: 62, start: '14:31', dur: '', log: genLog(88), kit: 'astillero' };
  return [running, done, failed];
}
function doneLog(variant) {
  const els = BASE.elements, L = [{ t: clockStr(0), lvl: 'info', msg: 'Leyendo el conjunto «Misiones de Puerto Niebla»' }, { t: clockStr(1), lvl: 'info', msg: '120 elementos en 4 tipos' }];
  for (let i = 0; i < 22; i++) { const e = els[(i * 5 + 2) % els.length], warn = variant !== 'clean' && i % 7 === 3; L.push({ t: clockStr(L.length), lvl: warn ? 'warn' : 'info', msg: warn ? `${e.id}: campo opcional vacío` : `${e.id} validado` }); }
  L.push({ t: clockStr(L.length), lvl: 'info', msg: variant === 'clean' ? 'Terminado: 120 elementos, sin hallazgos' : 'Terminado: 120 elementos, 9 hallazgos (2 errores, 5 avisos, 2 notas)' });
  return L;
}
const runningJob = () => DB.jobs.find(j => j.status === 'running') || null;
const busyText = () => { const j = runningJob(); return j ? `${j.name.replace('Construir kit', 'construyendo kit')} · ${Math.floor(j.pct)} %` : DB.reading ? 'releyendo el proyecto' : null; };
const busyReason = () => { const j = runningJob(); return j ? `Hay un trabajo en marcha: ${j.name} (${Math.floor(j.pct)} %). Espera a que termine o consúltalo en Trabajos.` : DB.reading ? 'Kiln está releyendo el proyecto.' : ''; };
function emitJob(job, line) { JOBS.subs.forEach(fn => fn(job, line)); renderStatus(); renderNav(); }
function startTimer() {
  clearInterval(JOBS.timer);
  JOBS.timer = setInterval(() => {
    const j = runningJob(); if (!j) return;
    j.pct = Math.min(100, j.pct + 0.9);
    const p = pick(BASE.piecesByKit.get(j.kit || 'astillero'));
    const line = { t: clockStr(j.log.length), lvl: R() < .08 ? 'warn' : 'info', msg: `Optimizando ${p.name} (${fmt(Math.round(300 + R() * 5000))} → ${fmt(Math.round(200 + R() * 3000))} triángulos)` };
    j.log.push(line);
    if (j.pct >= 100) {
      j.status = 'done'; j.dur = '4 min 02 s'; j.out = 'out/' + (j.kit || 'astillero') + '/'; j.summary = { a: 280, b: 3, c: 0 };
      j.log.push({ t: clockStr(j.log.length), lvl: 'info', msg: 'Construcción terminada: 280 piezas, 0 errores' });
      toast({ kind: 'ok', title: j.name + ': terminado', text: '280 piezas procesadas.', action: { label: 'Ver el registro', fn: () => go('trabajos', [j.id]) } });
    }
    emitJob(j, line);
  }, 700);
}
function startJob(name, kit) {
  const j = { id: 'j' + (++JOBS.seq), name, cmd: 'kiln build --kit ' + kit, status: 'running', pct: 3, start: '14:3' + (JOBS.seq % 9), dur: '', log: genLog(6), kit };
  DB.jobs.unshift(j); toast({ kind: 'info', title: 'Trabajo iniciado', text: name + '. Puedes seguir usando Kiln mientras tanto.', action: { label: 'Ver trabajo', fn: () => go('trabajos', [j.id]) } });
  emitJob(j); startTimer();
}

/* =========================================================================
   4. Ruta en la URL:  #/vista/a/b?clave=valor   (recargar y atras/adelante)
   ========================================================================= */
let route = { view: 'inicio', parts: [], q: new URLSearchParams() };
const KEEP = ['p', 't', 'm', 'd'];
function parseHash() {
  const raw = location.hash.replace(/^#/, '') || '/inicio';
  const [path, qs] = raw.split('?');
  const parts = path.split('/').filter(Boolean).map(decodeURIComponent);
  return { view: parts[0] || 'inicio', parts: parts.slice(1), q: new URLSearchParams(qs || '') };
}
function href(view, parts = [], params = {}) {
  const q = new URLSearchParams();
  route.q.forEach((v, k) => { if (KEEP.includes(k) || (view === route.view && !['x'].includes(k))) q.set(k, v); });
  for (const [k, v] of Object.entries(params)) { if (v === null || v === '' || v === undefined) q.delete(k); else q.set(k, v); }
  q.delete('x');
  const s = q.toString();
  return '#/' + [view, ...parts].map(encodeURIComponent).join('/') + (s ? '?' + s : '');
}
function go(view, parts, params) { location.hash = href(view, parts, params); }
function setParams(params, rerender) { // cambia parametros sin crear historial
  const h = href(route.view, route.parts, params);
  history.replaceState(null, '', h); route = parseHash(); if (rerender) onRoute(false);
}

/* ---- Avisos (toast): ok / info se cierran solos; error se queda con accion */
function toast(o) {
  const host = $(o.kind === 'error' ? '#alerts' : '#toasts');
  const el = document.createElement('div');

    }

        <section><h3 class="sec">Kits que lo usan</h3>${m.kits.length ? `<ul class="minilist">${m.kits.map(id => `<li><a href="${href('catalogo', [id], { q: m.name, sev: null })}">${esc(DB.kitById.get(id).name)}</a><span class="muted">${plural(DB.piecesByKit.get(id).filter(p => p.material === m.id).length, 'pieza', 'piezas')}</span></li>`).join('')}</ul>` : '<p class="muted">Ningún kit lo usa todavía.</p>'}</section>
        <section><h3 class="sec">Hallazgos <span class="n">${fl.length}</span></h3>${findingsHtml(fl)}</section>` }; }
    return { hint: 'Selecciona un material para ver dónde se usa.' };
  }
  if (v === 'arbol') {
    const n = TREE.byId.get(part[0] || 'juego');

      <dl><dt>Identificador</dt><dd>${esc(n.id)}</dd><dt>Declarado en</dt><dd>${esc(n.src)}</dd><dt>Elementos</dt><dd>${fmt(n.count)} ${esc(n.unit)}</dd><dt>Hijos</dt><dd>${n.kids.length}</dd></dl>

      ${n.kids.length ? `<section><h3 class="sec">Contiene</h3><ul class="minilist">${n.kids.map(c => `<li><a href="${href('arbol', [c.id])}">${esc(c.name)}</a><span class="muted">${fmt(c.count)}</span></li>`).join('')}</ul></section>` : ''}` };
  }
  if (v === 'contexto') {

      <div class="actions"><button type="button" class="btn ${c.state === 'open' ? 'primary' : ''}" data-act="claim" data-id="${c.id}">${c.state === 'open' ? 'Marcar como fijada' : 'Reabrir'}</button></div>
      <p class="muted">${c.state === 'open' ? 'Mientras esté abierta, Kiln no puede comprobar nada que dependa de ella.' : 'Kiln usa esta afirmación para validar piezas y contenido.'}</p>` };

/* =========================================================================
   7. Navegacion lateral y barra de estado
   ========================================================================= */
function renderNav() {
  const j = runningJob(), failed = DB.jobs.some(x => x.status === 'failed');
  const openQ = DB.questions.filter(q => !q.answer).length;
  const sevAll = DB.findings.reduce((s, f) => worst(s, f.sev), '');
  const maxOf = (t) => DB.findings.filter(f => f.type === t).reduce((s, f) => worst(s, f.sev), '');
  const items = [
    ['inicio', 'Inicio', '', ''], null,
    ['contexto', 'Contexto', openQ ? 'info' : '', DB.layers.length ? openQ + '<span class="full"> abiertas</span>' : ''], ['arbol', 'Árbol', sevAll, DB.kits.length ? fmt(DB.kits.length) : ''], null,
    ['contenido', 'Contenido', maxOf('element'), DB.elements.length ? fmt(DB.elements.length) : ''], ['catalogo', 'Catálogo', maxOf('piece'), DB.pieces.length ? fmt(DB.pieces.length) : ''], ['materiales', 'Materiales', maxOf('material'), DB.materials.length ? fmt(DB.materials.length) : ''], null,
    ['trabajos', 'Trabajos', j ? 'busy' : failed ? 'error' : '', j ? '1<span class="full"> en curso</span>' : DB.jobs.length ? fmt(DB.jobs.length) : '']
  ];
  const heads = ['', 'Estructura', 'Datos', 'Actividad']; let hi = 0, h = '';
  h += `<h2>${heads[hi++]}</h2>`;
  items.forEach(it => {
    if (!it) { h += `<h2>${heads[hi++]}</h2>`; return; }
    const [id, label, sev, cnt] = it;
    const sr = sev === 'busy' ? 'trabajo en curso' : sev ? ({ error: 'con errores', warn: 'con avisos', info: 'con notas' }[sev]) : '';
    h += `<a href="${href(id, [], { q: null, sev: null, f: null })}" ${route.view === id ? 'aria-current="page"' : ''}>${dot(sev || 'none')}<span>${label}${sr ? `<span class="sr"> (${sr})</span>` : ''}</span><span class="cnt">${cnt}</span></a>`;
  });
  h += `<div class="hint"><div><kbd>${isMac ? '⌘' : 'Ctrl'}</kbd> <kbd>K</kbd> comandos</div><div><kbd>/</kbd> buscar</div></div>`;
  $('#nav').innerHTML = h;
}
function renderStatus() {
  const t = busyText(), j = runningJob();
  $('#status').innerHTML = t
    ? `<a href="${href('trabajos', j ? [j.id] : [], { q: null, sev: null })}" title="Ver el trabajo">${dot('busy')}<span>ocupado: ${esc(t)}</span></a>`
    : `<span class="idle">${dot('ok')}<span class="t">Listo · releído hace 2 min</span></span>`;
}
function doReleer() {
  if (DB.reading) return;
  DB.reading = true; renderStatus(); renderNav();
  setTimeout(() => {
    DB.reading = false; renderStatus(); renderNav();
    toast(DB.empty ? { kind: 'info', title: 'Proyecto releído', text: 'Sigue sin haber kits. Añade uno y vuelve a leer.' }
      : { kind: 'ok', title: 'Proyecto releído', text: `${fmt(DB.pieces.length)} piezas y ${fmt(DB.findings.length)} hallazgos (sin cambios).` });
  }, 1100);
}

function viewInicio(root) {
  const k = DB.kits.length, p = DB.pieces.length;
  const tile = (v, l, d, to) => `<a class="tile${v ? '' : ' zero'}" href="${href(to, [], { q: null, sev: null })}"><div class="v">${fmt(v)}</div><div class="l">${l}</div><div class="d">${d}</div></a>`;
  const claims = DB.layers.reduce((n, l) => n + l.claims.length, 0);
  const tiles = `<div class="tiles">${tile(k, 'Kits', k ? '3 lugares' : 'ninguno todavía', 'catalogo')}${tile(p, 'Piezas', k ? 'en ' + k + ' kits' : 'sin piezas', 'catalogo')}${tile(DB.materials.length, 'Materiales', DB.materials.length ? 'de 512 a 2048 px' : 'sin materiales', 'materiales')}${tile(DB.elements.length, 'Elementos', DB.elements.length ? '1 conjunto · 4 tipos' : 'sin contenido', 'contenido')}${tile(DB.layers.length, 'Capas de contexto', claims ? claims + ' afirmaciones' : 'sin contexto', 'contexto')}</div>`;
  const linkOf = f => f.type === 'piece' ? href('catalogo', [f.kit, f.subj], { q: null, sev: null }) : f.type === 'material' ? href('materiales', [f.subj], { q: null, sev: null }) : href('contenido', [f.kind, f.subj], { q: null, sev: null });
  const whereOf = f => f.type === 'piece' ? DB.kitById.get(f.kit).name : f.type === 'material' ? 'Material' : 'Contenido';
  const group = sev => {
    const list = DB.bySev[sev]; if (!list.length) return '';
    const top = sev === 'info' ? [] : list.slice(0, 4);
    return `<div class="gh"><span class="sev ${sev}">${dot(sev)}</span><span class="t">${fmt(list.length)} ${SEVPL[sev]}</span><a href="${href('catalogo', [], { sev, q: null })}">Ver todos</a></div>${top.length ? `<ul>${top.map(f => `<li><a class="issue" href="${linkOf(f)}"><span class="mono">${esc(f.subj)}</span><span class="m">${esc(f.msg)}</span><span class="w">${esc(whereOf(f))}</span></a></li>`).join('')}</ul>` : ''}`;
  };
  let wrong;
  if (DB.empty) wrong = `<section aria-labelledby="hw"><h2 class="sec" id="hw">Cómo empezar</h2>${emptyBlock('Este proyecto aún no tiene nada que validar', 'Kiln lee <code>kiln.toml</code> y las carpetas que declare. Con estos tres pasos tendrás la primera validación.', '', '', { extra: '<ol><li>Declara un kit con su <code>kit.toml</code>.</li><li>Añade las piezas y los materiales que usa.</li><li>Pulsa <b>Releer</b> y revisa lo que Kiln encuentre.</li></ol>' })}</section>`;
  else if (!DB.findings.length) wrong = `<section aria-labelledby="hw"><h2 class="sec" id="hw">Qué falla</h2><div class="calm">${svgCheck}<div><b>Sin problemas</b><span>${fmt(p)} piezas, ${DB.materials.length} materiales y ${DB.elements.length} elementos validan. Última comprobación hace 2 min.</span></div></div></section>`;
  else wrong = `<section aria-labelledby="hw"><h2 class="sec" id="hw">Qué falla <span class="n">${fmt(DB.findings.length)} hallazgos</span></h2><div class="card issues">${group('error')}${group('warn')}${group('info')}</div></section>`;
  let next;
  if (DB.empty) next = `<div class="card next"><div class="sec" style="margin:0">Siguiente paso</div><h3>Declara tu primer kit</h3><p>Un kit es una carpeta con un <code>kit.toml</code> y las piezas que agrupa. Con uno ya podrás validar y construir.</p><div class="row"><button type="button" class="btn primary" data-act="asistente">Abrir el asistente de inicio</button></div></div>`;
  else if (DB.badKit) { const first = DB.fBy.piece && DB.findings.find(f => f.sev === 'error' && f.kit === DB.badKit.id); next = `<div class="card next"><div class="sec" style="margin:0">Siguiente paso</div><h3>Corrige los ${DB.badKit.c.error} errores del kit ${esc(DB.badKit.name)}</h3><p>Bloquean su construcción. Empieza por el primero: ${esc(first.msg)}</p><div class="row"><a class="btn primary" style="text-decoration:none" href="${linkOf(first)}">Abrir el primer error</a><a class="btn" style="text-decoration:none;color:inherit" href="${href('catalogo', [DB.badKit.id], { sev: 'error', q: null })}">Ver los ${DB.badKit.c.error} errores</a></div></div>`; }
  else next = `<div class="card next"><div class="sec" style="margin:0">Siguiente paso</div><h3>Construye el kit Muelle viejo</h3><p>Es el último que cambió y no tiene una construcción reciente. Todo lo demás está validado.</p><div class="row">${actBtn('Construir el kit', 'construir', { primary: 1, needsIdle: true, data: 'data-kit="muelle-viejo"' })}</div></div>`;
  const j = runningJob();
  const jobs = DB.jobs.length ? `<section aria-labelledby="hj"><h2 class="sec" id="hj">Trabajos</h2><div class="card">${j ? `<div class="jobmini"><div class="top"><b>${esc(j.name)}</b><span class="muted">${Math.floor(j.pct)} %</span></div><div class="meter" role="progressbar" aria-valuenow="${Math.floor(j.pct)}" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso de ${esc(j.name)}"><i id="hjbar" style="width:${j.pct}%"></i></div></div>` : ''}<ul class="joblist">${DB.jobs.filter(x => x !== j).slice(0, 3).map(x => `<li><a href="${href('trabajos', [x.id], { q: null, sev: null })}">${dot(x.status === 'failed' ? 'error' : 'ok')}<span>${esc(x.name)}</span><span class="when">${x.status === 'failed' ? 'falló' : 'terminado'} · ${esc(x.start)}</span></a></li>`).join('')}</ul></div></section>` : '';
  root.innerHTML = `<div class="page">${pageHead('Puerto Niebla', DB.empty ? 'Proyecto sin contenido todavía · kiln.toml encontrado' : 'Releído hace 2 min · kiln.toml · 3 lugares')}
    <div class="home-grid"><div><section aria-labelledby="hh"><h2 class="sec" id="hh">Qué tiene el proyecto</h2>${tiles}</section>${wrong}</div>
    <div>${next}${jobs}</div></div></div>`;
  const sub = (job) => { const b = $('#hjbar', root); if (b && job.status === 'running') { b.style.width = job.pct + '%'; b.parentNode.setAttribute('aria-valuenow', Math.floor(job.pct)); b.parentNode.previousElementSibling.lastChild.textContent = Math.floor(job.pct) + ' %'; } };
  JOBS.subs.add(sub);
  return { update() {}, destroy() { JOBS.subs.delete(sub); } };
}

function viewCatalogo(root, rt) {
  if (!DB.pieces.length) {
    root.innerHTML = `<div class="page">${pageHead('Catálogo', 'Piezas por kit')}${emptyBlock('Todavía no hay kits', 'El catálogo lista las piezas de cada kit con su estado de validación. Declara un kit y aparecerán aquí.', 'Abrir el asistente de inicio', 'asistente')}</div>`;
    return { update() {}, destroy() {}, noPanel: true };
  }
  root.innerHTML = `<div class="page fill">${pageHead('Catálogo', `${fmt(DB.pieces.length)} piezas en ${DB.kits.length} kits`, '<div id="cat-act"></div>')}
    <div class="split"><nav class="card sidelist" aria-label="Kits" id="kl"></nav><div class="pane"><div id="ft"></div><div id="vl" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div></div></div>`;
  let kit = 'todos', sel = null;
  const f = Filters($('#ft', root), { id: 'cat', label: 'Filtrar piezas', placeholder: 'Filtrar por nombre, kit o material', noun: ['pieza', 'piezas'], onChange: () => recompute() });
  const pcol = { fr: v => v };
  const vl = VList($('#vl', root), {
    label: 'Piezas', sort: { key: 'name', dir: 1 }, rowH: 33,
    columns: [
      { key: 'name', label: 'Nombre', w: 'minmax(150px, 2.2fr)', min: 150, sort: 1, cls: 'mono', cell: r => esc(r.name) },
      { key: 'kitn', label: 'Kit', w: 'minmax(96px, 1.2fr)', min: 96, sort: 1, opt: 1, prio: 5, val: r => DB.kitById.get(r.kit).name, cell: r => esc(DB.kitById.get(r.kit).name) },
      { key: 'material', label: 'Material', w: 'minmax(110px, 1.3fr)', min: 110, sort: 1, opt: 1, prio: 4, cls: 'mono', cell: r => esc(r.material) },
      { key: 'tris', label: 'Triángulos', w: '80px', min: 80, align: 'r', sort: 1, opt: 1, prio: 6, bad: r => r.tris > 6000, cell: r => fmt(r.tris) },
      { key: 'kb', label: 'Tamaño KB', w: '84px', min: 84, align: 'r', sort: 1, opt: 1, prio: 2, cell: r => fmt(r.kb) },
      { key: 'sev', label: 'Estado', w: '108px', min: 108, sort: 1, val: r => RANK[r.sev] * 1000 + r.nf, cell: r => sevLabel(r.sev, r.nf) }
    ],
    onSelect: r => { panelOpen = true; go('catalogo', [kit, r.id]); }
  });
  function scope() { return kit === 'todos' ? DB.pieces : DB.piecesByKit.get(kit) || []; }
  function recompute(keepScroll) {
    const s = scope(), st = f.state();
    const tally = { error: 0, warn: 0, info: 0, none: 0 };
    s.forEach(p => tally[p.sev || 'none']++);
    f.setTally(tally);
    const rows = s.filter(p => passSev(st.sevs, p.sev) && (!st.q || norm(p.k + ' ' + DB.kitById.get(p.kit).name).includes(st.q)));
    f.setCount(rows.length, s.length);
    if (!rows.length) { $('#vl', root).dataset.empty = '1'; }
    vl.hide(kit === 'todos' ? [] : ['kitn']);
    vl.setRows(rows, keepScroll);
    const none = $('#cat-none', root); if (none) none.remove();
    if (!rows.length) $('.vb', root).insertAdjacentHTML('beforebegin', `<div class="vnone" id="cat-none">${emptyBlock('Ninguna pieza coincide', `Ningún resultado con los filtros actuales en ${kit === 'todos' ? 'todos los kits' : esc(DB.kitById.get(kit).name)}.`, 'Quitar filtros', 'clear-filters', { small: 1 })}</div>`);
    $('#cat-act', root).innerHTML = kit === 'todos' ? '' : actBtn('Construir este kit', 'construir', { needsIdle: true, data: `data-kit="${esc(kit)}"`, align: 'right' });
  }
  function kitList() {
    $('#kl', root).innerHTML = `<h2>Kits</h2><a href="${href('catalogo', [], { q: null, sev: null })}" ${kit === 'todos' ? 'aria-current="true"' : ''}>${dot('none')}<span>Todos los kits</span><span class="cnt">${fmt(DB.pieces.length)}</span></a><hr>` +
      DB.kits.map(k => `<a href="${href('catalogo', [k.id], {})}" title="${esc(k.name)}" ${kit === k.id ? 'aria-current="true"' : ''}>${dot(k.sev || 'none')}<span>${esc(k.name)}${k.sev ? `<span class="sr"> (${{ error: 'con errores', warn: 'con avisos', info: 'con notas' }[k.sev]})</span>` : ''}</span><span class="cnt">${fmt(k.count)}</span></a>`).join('');
  }
  function apply(rt, first) {
    const nk = rt.parts[0] && DB.kitById.has(rt.parts[0]) ? rt.parts[0] : 'todos', ns = rt.parts[1] || null;
    const kitChanged = nk !== kit || first; kit = nk; sel = ns;
    f.sync(rt); kitList(); recompute(!kitChanged);
    vl.select(sel, true);
  }
  apply(rt, true);
  return { update: rt2 => apply(rt2, false), destroy() { vl.destroy(); }, clearFilters: () => { setParams({ q: null, sev: null }); apply(route, false); }, focusFilter: f.focus };
}

      DB.kinds.map(k => `<a href="${href('contenido', [k.id], {})}" title="${esc(k.name)}" ${kind === k.id ? 'aria-current="true"' : ''}>${dot(k.sev || 'none')}<span>${esc(k.name)}${k.sev ? `<span class="sr"> (${{ error: 'con errores', warn: 'con avisos', info: 'con notas' }[k.sev]})</span>` : ''}</span><span class="cnt">${k.count}</span></a>`).join('');

/* =========================================================================
   12. VISTA · Árbol (esquema plegable con recuentos, no un lienzo libre)
   ========================================================================= */
const TREE = { byId: new Map(), root: null };
function buildTree() {
  const mk = (id, name, kindLabel, o = {}) => ({ id, name, kindLabel, kids: [], count: 0, unit: o.unit || 'piezas', nf: 0, sev: '', src: o.src || 'kiln.toml', open: null, openLabel: '', parent: null, ...o });
  const root = mk('juego', 'Puerto Niebla', 'Juego', { src: 'kiln.toml' });
  TREE.byId = new Map([[root.id, root]]);
  const reg = (n, parent) => { n.parent = parent; parent.kids.push(n); TREE.byId.set(n.id, n); return n; };
  if (DB.kits.length) {
    const lug = reg(mk('lugares', 'Lugares', 'Grupo', { src: 'kiln.toml' }), root);
    PLACES.forEach(pl => {
      const pn = reg(mk('lugar-' + pl.id, pl.name, 'Lugar', { src: 'kiln.toml' }), lug);
      DB.kits.filter(k => k.place === pl.id).forEach(k => {
        const kn = reg(mk('kit-' + k.id, k.name, 'Kit', { src: `kits/${k.id}/kit.toml`, open: href('catalogo', [k.id], { q: null, sev: null }), openLabel: 'Abrir en el catálogo' }), pn);
        kn.count = k.count; kn.nf = k.c.error + k.c.warn + k.c.info; kn.sev = k.sev; kn.leaf = true;
      });
    });
    const con = reg(mk('contenido', 'Contenido', 'Grupo', { src: 'content/', unit: 'elementos' }), root);
    const cs = reg(mk('conjunto-misiones', 'Misiones de Puerto Niebla', 'Conjunto', { src: 'content/set.toml', unit: 'elementos', open: href('contenido', [], { q: null, sev: null }), openLabel: 'Abrir en Contenido' }), con);
    DB.kinds.forEach(k => { const kn = reg(mk('tipo-' + k.id, k.name, 'Tipo', { src: `content/${k.id}/`, unit: 'elementos', open: href('contenido', [k.id], { q: null, sev: null }), openLabel: 'Abrir en Contenido' }), cs); kn.count = k.count; kn.sev = k.sev; kn.nf = DB.findings.filter(f => f.kind === k.id).length; kn.leaf = true; });
  }
  (function roll(n) { n.kids.forEach(roll); if (n.kids.length) { n.count = n.kids.reduce((s, c) => s + c.count, 0); n.nf = n.kids.reduce((s, c) => s + c.nf, 0); n.sev = n.kids.reduce((s, c) => worst(s, c.sev), ''); } })(root);
  TREE.root = root;
}
function viewArbol(root, rt) {
  buildTree();
  const expanded = new Set(['juego', 'lugares', 'lugar-puerto', 'lugar-casco', 'lugar-costa', 'contenido', 'conjunto-misiones']);
  let onlyIssues = false, focusId = 'juego', sel = null;
  root.innerHTML = `<div class="page fill">${pageHead('Árbol', 'Cómo se organiza el juego: lugares, kits y contenido')}
    <ol class="crumbs" id="crumbs" aria-label="Ruta del nodo seleccionado"></ol>
    <div class="toolbar"><button type="button" class="btn sm" id="ex">Desplegar todo</button><button type="button" class="btn sm" id="co">Plegar todo</button>
      <button type="button" class="chip" id="oi" aria-pressed="false">Solo con problemas</button><span class="grow"></span><span class="muted" style="font-size:12px">Flechas para moverte · ← → para plegar y desplegar · Enter para seleccionar</span></div>
    <div class="card tree" id="tr" role="tree" aria-label="Estructura del proyecto"></div></div>`;
  const tr = $('#tr', root);
  function visible() {
    const out = [];
    (function walk(n, lvl) { if (onlyIssues && !n.sev && n.id !== 'juego') return; out.push({ n, lvl }); if (n.kids.length && expanded.has(n.id)) n.kids.forEach(c => walk(c, lvl + 1)); })(TREE.root, 1);
    return out;
  }
  function draw() {
    const vis = visible();
    if (!vis.some(v => v.n.id === focusId)) focusId = vis[0].n.id;
    tr.innerHTML = vis.map(({ n, lvl }, i) => {
      const exp = n.kids.length ? ` aria-expanded="${expanded.has(n.id)}"` : '';
      return `<div class="trow" role="treeitem" id="tn-${esc(n.id)}" data-id="${esc(n.id)}" aria-level="${lvl}" aria-posinset="${i + 1}" aria-setsize="${vis.length}"${exp} aria-selected="${n.id === sel}" tabindex="${n.id === focusId ? 0 : -1}" style="padding-left:${12 + (lvl - 1) * 22}px">
        <button type="button" class="chev" tabindex="-1" aria-label="${expanded.has(n.id) ? 'Plegar' : 'Desplegar'} ${esc(n.name)}"></button><span class="kd">${esc(n.kindLabel)}</span><span class="nm">${esc(n.name)}</span>
        <span class="ct">${fmt(n.count)} ${esc(n.unit)}</span><span class="sv">${n.sev ? `<span class="sev ${n.sev}">${dot(n.sev)}${fmt(n.nf)}<span class="sr"> hallazgos, ${SEVNAME[n.sev]}</span></span>` : '<span class="sev ok" title="Sin problemas">' + dot('ok') + '<span class="sr">sin problemas</span></span>'}</span></div>`;
    }).join('');
    if (!DB.kits.length) tr.insertAdjacentHTML('beforeend', `<div style="padding:16px">${emptyBlock('El árbol aún no tiene kits', 'Declara lugares y kits y aparecerán aquí con sus recuentos.', 'Abrir el asistente de inicio', 'asistente', { small: 1 })}</div>`);
    $('#oi', root).setAttribute('aria-pressed', onlyIssues);
  }
  function crumbs() {
    const chain = []; for (let n = TREE.byId.get(sel || 'juego'); n; n = n.parent) chain.unshift(n);
    $('#crumbs', root).innerHTML = chain.map((n, i) => `<li>${i === chain.length - 1 ? `<span aria-current="location">${esc(n.name)}</span>` : `<a href="${href('arbol', [n.id])}">${esc(n.name)}</a>`}</li>`).join('');
  }
  const focusRow = id => { focusId = id; draw(); const el = $('#tn-' + CSS.escape(id), tr); el && el.focus(); };
  tr.addEventListener('click', e => {
    const row = e.target.closest('.trow'); if (!row) return; const id = row.dataset.id, n = TREE.byId.get(id);
    if (e.target.closest('.chev')) { expanded.has(id) ? expanded.delete(id) : expanded.add(id); focusId = id; draw(); return; }
    focusId = id; panelOpen = true; go('arbol', [id]);
  });
  tr.addEventListener('dblclick', e => { const row = e.target.closest('.trow'); if (!row) return; const id = row.dataset.id; if (TREE.byId.get(id).kids.length) { expanded.has(id) ? expanded.delete(id) : expanded.add(id); draw(); } });
  tr.addEventListener('keydown', e => {
    const vis = visible(), i = vis.findIndex(v => v.n.id === focusId); if (i < 0) return; const n = vis[i].n;
    const k = e.key;
    if (k === 'ArrowDown' && i < vis.length - 1) { e.preventDefault(); focusRow(vis[i + 1].n.id); }
    else if (k === 'ArrowUp' && i > 0) { e.preventDefault(); focusRow(vis[i - 1].n.id); }
    else if (k === 'Home') { e.preventDefault(); focusRow(vis[0].n.id); }
    else if (k === 'End') { e.preventDefault(); focusRow(vis[vis.length - 1].n.id); }
    else if (k === 'ArrowRight') { e.preventDefault(); if (n.kids.length && !expanded.has(n.id)) { expanded.add(n.id); focusRow(n.id); } else if (n.kids.length) focusRow(n.kids[0].id); }
    else if (k === 'ArrowLeft') { e.preventDefault(); if (n.kids.length && expanded.has(n.id)) { expanded.delete(n.id); focusRow(n.id); } else if (n.parent) focusRow(n.parent.id); }
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); panelOpen = true; go('arbol', [n.id]); }
  });
  $('#ex', root).onclick = () => { TREE.byId.forEach(n => n.kids.length && expanded.add(n.id)); draw(); };
  $('#co', root).onclick = () => { expanded.clear(); expanded.add('juego'); draw(); };
  $('#oi', root).onclick = () => { onlyIssues = !onlyIssues; draw(); };
  function apply(rt) {
    sel = rt.parts[0] && TREE.byId.has(rt.parts[0]) ? rt.parts[0] : null;
    for (let n = sel && TREE.byId.get(sel).parent; n; n = n.parent) expanded.add(n.id);
    if (sel) focusId = sel; draw(); crumbs();
  }
  apply(rt);
  return { update: apply, destroy() {} };
}

    d.innerHTML = `<div class="jhead"><h2>${esc(j.name)}</h2>${jstat(j)}</div>${meta}${body}
      <div class="logwrap"><div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Registro de ${esc(j.name)}" tabindex="0">${j.log.map(lineHtml).join('')}</div>
      <button type="button" class="btn primary toend" id="toend" hidden></button></div>`;
    log = $('#log', root); pill = $('#toend', root); newCount = 0; stuck = true;
    log.scrollTop = log.scrollHeight;
    log.addEventListener('scroll', () => { stuck = atBottom(); if (stuck) { newCount = 0; pill.hidden = true; } });
    if (lro) lro.disconnect();
    lro = new ResizeObserver(() => { if (stuck) log.scrollTop = log.scrollHeight; }); lro.observe(log);
    pill.onclick = () => { log.scrollTop = log.scrollHeight; stuck = true; newCount = 0; pill.hidden = true; log.focus(); };
  }
  const sub = (job, line) => {
    list();
    if (!cur || job.id !== cur.id) return;
    if (job.status !== 'running') { detail(); return; }
    const b = $('#jbar', root); if (b) { b.style.width = job.pct + '%'; b.parentNode.setAttribute('aria-valuenow', Math.floor(job.pct)); $('#jpct', root).textContent = Math.floor(job.pct) + ' %'; }
    if (line && log) {
      stuck = atBottom(); // medida en vivo: no depende de que haya llegado el evento de scroll
      log.insertAdjacentHTML('beforeend', lineHtml(line));
      if (stuck) log.scrollTop = log.scrollHeight; else { newCount++; pill.hidden = false; pill.textContent = `${newCount} ${newCount === 1 ? 'línea nueva' : 'líneas nuevas'} · ir al final`; }
    }
  };
  JOBS.subs.add(sub);
  function apply(rt) {
    const j = DB.jobs.find(x => x.id === rt.parts[0]) || DB.jobs.find(x => x.status === 'running') || DB.jobs[0];
    if (cur && cur.id === j.id && log && log.isConnected) { list(); return; }
    cur = j; list(); detail();
  }
  apply(rt);
  return { update: apply, destroy() { JOBS.subs.delete(sub); lro && lro.disconnect(); } };
}

/* =========================================================================
   15. Conmutador de demostracion (SOLO maqueta) y acciones globales
   ========================================================================= */
function setTheme(t) { setParams({ t }); document.documentElement.dataset.theme = t; renderDemo(); }
function renderDemo() {
  const open = route.q.get('m') === '1', v = DB.variant, t = document.documentElement.dataset.theme;
  const pb = (k, l) => `<button type="button" data-act="variant" data-v="${k}" aria-pressed="${v === k}">${l}</button>`;
  const tb = (k, l) => `<button type="button" data-act="theme" data-v="${k}" aria-pressed="${t === k}">${l}</button>`;
  $('#demo').innerHTML = `<button type="button" data-act="demo" aria-expanded="${open}" aria-controls="demobox">Maqueta · demo</button>${open ? `<div class="box" id="demobox" role="group" aria-label="Controles de demostración"><p><b>Solo de la maqueta.</b> No existe en el producto real.</p>
    <fieldset><legend>Proyecto</legend><div class="seg">${pb('problems', 'Con problemas')}${pb('clean', 'Limpio')}${pb('empty', 'Vacío')}</div></fieldset>
    <fieldset><legend>Tema</legend><div class="seg">${tb('light', 'Claro')}${tb('dark', 'Oscuro')}</div></fieldset>
    <fieldset><legend>Probar avisos</legend><div class="seg"><button type="button" data-act="toast-ok">Éxito</button><button type="button" data-act="toast-err">Error</button></div></fieldset></div>` : ''}`;
}
function setVariant(v) { // cambia de proyecto de demostracion: reinicia indices y trabajos
  clearInterval(JOBS.timer);
  DB = buildDB(v); DB.jobs = makeJobs(v); lastDetailKey = '';
  if (runningJob()) startTimer();
  $('#projName').textContent = 'Puerto Niebla';
}

document.addEventListener('click', e => {
  const dis = e.target.closest('[aria-disabled="true"][data-act]');
  if (dis) { e.preventDefault(); toast({ kind: 'info', title: 'No disponible ahora', text: dis.dataset.tip }); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const sel = () => route.view === 'catalogo' && route.parts[1];
  switch (act) {
    case 'skip': $('#main').focus(); break;
    case 'palette': openPalette(); break;
    case 'panel': togglePanel(); break;
    case 'releer': doReleer(); break;
    case 'variante': openVariant(b.dataset.piece || sel()); break;
    case 'visor': toast({ kind: 'info', title: 'Visor 3D', text: 'En el producto, el visor se carga bajo demanda y libera su contexto al cerrarse.' }); break;
    case 'construir': { const k = b.dataset.kit || 'astillero'; startJob('Construir kit ' + DB.kitById.get(k).name, k); break; }
    case 'copiar': toast({ kind: 'ok', title: 'Ruta copiada', text: b.dataset.what || 'Ruta copiada al portapapeles.' }); break;
    case 'asistente': toast({ kind: 'info', title: 'Asistente de inicio', text: 'En el producto se abriría aquí el asistente actual (sin cambios).' }); break;
    case 'cancelar': toast({ kind: 'info', title: 'Cancelación solicitada', text: 'Maqueta: el trabajo simulado sigue hasta el final.' }); break;
    case 'retry': toast({ kind: 'error', title: 'No se pudo reintentar', text: 'El material «cristal_sucio» sigue sin textura base. Corrígelo antes de volver a lanzar la exportación.', action: { label: 'Abrir el kit Faro', fn: () => go('catalogo', ['faro'], { sev: 'error', q: null }) } }); break;
    case 'clear-filters': cur && cur.clearFilters && cur.clearFilters(); break;
    case 'ctx-all': setParams({ f: null }, true); break;
    case 'claim': { const c = DB.claimById.get(b.dataset.id); c.state = c.state === 'open' ? 'set' : 'open'; renderNav(); renderDetail(true); cur.redraw && cur.redraw(); toast({ kind: 'ok', title: c.state === 'set' ? 'Afirmación fijada' : 'Afirmación reabierta', text: c.text }); break; }
    case 'answer': { const q = DB.questions.find(x => x.id === b.dataset.q); q.answer = b.dataset.o; const c = DB.claimById.get(q.claim); if (c) c.state = 'set'; renderNav(); cur.redraw && cur.redraw(); toast({ kind: 'ok', title: 'Respuesta guardada', text: `«${q.answer}». Se ha fijado la afirmación relacionada.` }); break; }
    case 'later': toast({ kind: 'info', title: 'Pregunta aplazada', text: 'Seguirá en la lista de Contexto.' }); break;
    case 'demo': setParams({ m: route.q.get('m') === '1' ? null : '1' }); renderDemo(); $('#demo button').focus(); break;
    case 'variant': setParams({ p: b.dataset.v === 'problems' ? null : b.dataset.v }, true); renderDemo(); break;
    case 'theme': setTheme(b.dataset.v); $('#demo [data-act=theme][aria-pressed=true]').focus(); break;
    case 'toast-ok': toast({ kind: 'ok', title: 'Guardado', text: 'Los cambios se han aplicado.' }); break;
    case 'toast-err': toast({ kind: 'error', title: 'No se pudo leer kits/faro/kit.toml', text: 'Línea 14: falta el cierre de la tabla [materials].', action: { label: 'Reintentar', fn: () => toast({ kind: 'ok', title: 'Releído', text: 'El fichero ya es válido.' }) } }); break;
  }
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); dlgP.open ? dlgP.close() : openPalette(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey) { e.preventDefault(); gq.focus(); gq.select(); }
  if (e.key === 'Escape' && panelOpen && !wide() && !dlgP.open && !dlgV.open && route.view !== 'inicio' && $('#shell').classList.contains('with-detail')) togglePanel(false);
});

/* =========================================================================
   16. Arranque y enrutado
   ========================================================================= */
const VIEWS = { inicio: viewInicio, contexto: viewContexto, arbol: viewArbol, contenido: viewContenido, catalogo: viewCatalogo, materiales: viewMateriales, trabajos: viewTrabajos };
const TITLES = { inicio: 'Inicio', contexto: 'Contexto', arbol: 'Árbol', contenido: 'Contenido', catalogo: 'Catálogo', materiales: 'Materiales', trabajos: 'Trabajos' };
let cur = null, firstLoad = true, lastSel = '';
function onRoute() {
  route = parseHash();
  if (!VIEWS[route.view]) { route.view = 'inicio'; route.parts = []; }
  const p = ['problems', 'clean', 'empty'].includes(route.q.get('p')) ? route.q.get('p') : 'problems';
  const t = route.q.get('t') || document.documentElement.dataset.themeBoot;
  document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
  let rebuilt = false;
  if (!DB || DB.variant !== p) { setVariant(p); rebuilt = true; }
  const selKey = route.view + '|' + route.parts.join('/');
  if (firstLoad) { const d = route.q.get('d'); panelOpen = d ? d === '1' : wide(); }
  else if (route.parts.length && selKey !== lastSel) panelOpen = panelOpen || true;
  lastSel = selKey;
  applyPanel();
  const main = $('#main');
  if (rebuilt || !cur || cur.name !== route.view) {
    cur && cur.destroy && cur.destroy(); main.innerHTML = ''; main.scrollTop = 0;
    cur = VIEWS[route.view](main, route); cur.name = route.view;
    if (!firstLoad) main.focus({ preventScroll: true });
  } else cur.update && cur.update(route);
  document.title = TITLES[route.view] + ' · Kiln (maqueta)';
  renderNav(); renderStatus(); renderDetail(rebuilt); applyPanel(); renderDemo();
  if (firstLoad && ['ok', 'err'].includes(route.q.get('x'))) { const x = route.q.get('x'); setTimeout(() => { x === 'err' ? toast({ kind: 'error', title: 'No se pudo leer kits/faro/kit.toml', text: 'Línea 14: falta el cierre de la tabla [materials].', action: { label: 'Reintentar', fn() {} } }) : toast({ kind: 'ok', title: 'Proyecto releído', text: '3.012 piezas y 600 hallazgos (sin cambios).' }); }, 50); }
  if (firstLoad && route.q.get('x') === 'dlg') setTimeout(() => openVariant('astillero_grua_01'), 60);
  if (firstLoad && route.q.get('x') === 'pal') setTimeout(openPalette, 60);
  if (firstLoad && route.q.get('x') === 'search') setTimeout(() => { gq.focus(); gq.value = 'asti'; gSearch(); }, 60);
  firstLoad = false;
}
document.documentElement.dataset.themeBoot = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
$('#kk').textContent = isMac ? '⌘ K' : 'Ctrl K';
window.addEventListener('hashchange', onRoute);
window.addEventListener('resize', debounce(() => { applyPanel(); }, 100));
onRoute();
document.documentElement.dataset.ready = '1';
</script>
