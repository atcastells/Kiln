# Example context for Rune World made through Kiln on 2026-11-13: the text and the
# answers to q1 and q2 were written by Claude to test it, not by the project owner;
# the claims and questions are what the agent wrote from them and the project files.
text = "Rune es un mundo de fantasía medieval baja que se genera entero por semilla: un continente con sus islas, reinos de humanos, enanos, orcos y drows, y gente que vive su día (oficios, rutinas, rumores). La magia es rara, antigua y tiene precio. El jugador es una persona más del mundo, con muerte definitiva. Visualmente queremos algo sobrio y creíble, como Kingdom Come: casas de troncos y piedra, nada brillante. Todo lo que se dibuja tiene que tener un uso en la simulación. El motor es Godot 4 y los assets son CC0 o CC-BY, con un máximo de 20 000 triángulos."

