# kiln.toml of an invented game, Puerto Niebla, to show the format. Copy it to
# the root of your game (or pass it with --config) and change the paths, which
# are relative to the project root.
[project]
name = "Puerto Niebla"
engine = "godot"

[assets]
kits = ["godot/kits"]          # each subfolder is a kit: models, JSON manifests, LICENSE.md
specs = "kiln/specs"

[materials]
tables = ["data/materials.toml"]   # TOML arrays of tables with an `id`
textures = ["godot/textures"]      # `<key>_albedo.<ext>`
color_keys = ["color"]

[rules]
licenses = ["CC0", "CC-BY"]
max_tris = 15000
require_use = false

# The tree of the project, from the game down to its assets.
[[levels]]
level = "place"
files = ["data/districts.toml"]
table = "districts"
id = "id"
name = "name"
children = [{ key = "buildings", level = "building" }]

[[levels]]
level = "building"
files = ["data/buildings/*.toml"]
id = "id"
name = "name"
children = [{ key = "rooms", field = "id", level = "room" }]

[[levels]]
level = "room"
files = ["data/rooms.toml"]
table = "rooms"
id = "id"
children = [{ key = "props", field = "id", level = "asset" }]

# Asset sites for parts marked "search"; each site gets its own kit.
[sources]
sites = ["polyhaven", "polypizza", "sketchfab"]

[tools]
godot_project = "godot"

[context]
file = "kiln/context.toml"
