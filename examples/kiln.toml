# kiln.toml of an invented game, Puerto Niebla, to show the format. It runs as
# it is (`kiln serve --project examples`); for your game, copy it to its root
# (or pass it with --config) and change the paths, relative to the project root.
[project]
name = "Puerto Niebla"
engine = "godot"

[assets]
kits = ["godot/kits"]          # each subfolder is a kit: models, JSON manifests, LICENSE.md
specs = "specs"

[materials]
tables = ["data/materials.toml"]   # TOML arrays of tables with an `id`
textures = ["godot/textures"]      # `<key>_albedo.<ext>`
color_keys = ["color"]
# godot = "res://materials/{key}.tres"   # the Godot material of each palette key

[rules]
licenses = ["CC0", "CC-BY"]
max_tris = 15000
require_use = false

# The tree of the project, from the game down to its assets.
[[levels]]
level = "place"
files = ["data/districts.toml"]
table = "districts"
id = "id"
name = "name"
children = [{ key = "buildings", level = "building" }]

[[levels]]
level = "building"
files = ["data/buildings/*.toml"]
id = "id"
name = "name"
children = [{ key = "rooms", field = "id", level = "room" }]

[[levels]]
level = "room"
files = ["data/rooms.toml"]
table = "rooms"
id = "id"
children = [{ key = "props", field = "id", level = "asset" }]

# Asset sites for parts marked "search"; each site gets its own kit.
[sources]
sites = ["polyhaven", "polypizza", "sketchfab"]

[tools]
godot_project = "godot"

[context]
file = "context.toml"

# La UI del juego: Kiln lee el tema y los scripts como texto, sin Godot.
# Rutas relativas al proyecto. Cada regla lleva `level = "warn" | "error" | "off"`
# (por defecto warn; error hace que `kiln check` salga con 1).
[ui]
theme = "godot/ui/theme.tres"
scripts = ["godot/ui/*.gd"]                # donde se buscan variaciones usadas y estilo fuera del tema
# scenes = ["godot/ui/*.tscn"]             # escenas con UI, si las hay
target = "ui_target.toml"           # estado de los criterios de UI

[ui.contrast]
normal = 4.5                               # texto normal
large = 3.0                                # texto grande y lo que no es texto
large_from_px = 18                         # desde este tamaño el texto cuenta como grande
level = "warn"

# El texto con contorno (HarborHud) se mide contra el contorno. El resto
# necesita una pareja: la variación con `font_color` y la caja de estilo de fondo.
[[ui.contrast.pairs]]
fg = "HarborTitle"
bg = "HarborPanel/panel"

[[ui.contrast.pairs]]
fg = "HarborBody"
bg = "HarborPanel/panel"

[ui.glyphs]
level = "warn"
[ui.theme_coherent]
level = "warn"
[ui.theme_only]
level = "warn"
