# Spec written by Claude Code through Kiln for «crear un ascensor» in Rune World
# (2026-11-13), kept as it came out.
[asset]
id = "hoist"
name = "Montacargas de torno"
asked = "crear un ascensor"
used_by = ["fort_works", "house_loft"]
where = "al pie del andamio de las obras de la casa fuerte (sube piedra y madera) y en el hastial de la casa con sobrado (sube los sacos)"
states = ["down", "up", "loaded"]
budget_tris = 4000
status = "inventory"
notes = "En el mundo de Rune un ascensor es un montacargas de torno: dos postes, travesaño con polea, rodillo con manivela y una plataforma de tablas colgada de la soga. Lo usarían las obras de la casa fuerte (godot/buildings/fort_works.gd, el andamio de fort_plot.gd) y el sobrado (house_loft.gd, forts.toml sack_layers), pero hoy ninguna regla de rune-core mueve carga con él: hay que decidir su uso en la simulación antes de dibujarlo (regla «lo dibujado tiene uso»). No hay kiln.toml en el proyecto ni material de soga en la paleta: propongo la clave nueva hemp_rope. El rodillo serviría también para sustituir el torno del pozo, hoy hecho con código en stone_mass.gd (regla 098). Las piezas medievalkit no traen medida en el catálogo; las medidas de plataforma y sacos son las deseadas."

