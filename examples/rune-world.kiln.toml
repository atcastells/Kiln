# kiln.toml for rune-world (copy it to the root of the game repo, or pass it
# with --config). Paths are relative to the project root.
[project]
name = "Rune World"
engine = "godot"

[assets]
kits = ["godot/kit"]
specs = "data/assets"

[materials]
tables = ["data/buildings/materials.toml"]
textures = ["godot/textures"]

[rules]
# Rune admits CC0 and CC-BY (docs/principios.md); NC, ND and SA do not enter, GPL not without a decision.
licenses = ["CC0", "CC-BY"]
max_tris = 20000

# The tree of the project, from the game down to its assets. Rune's world is
# generated, so its nodes are kinds (the fortified house), not places.
[[levels]]
level = "place"
files = ["data/buildings/forts.toml"]
table = "forts"
id = "id"
name = "name"
children = [{ key = "house_piece", level = "building" }, { key = "house_chamber", level = "building" }]

[[levels]]
level = "building"
files = ["data/buildings/schemas/*.toml"]
id = "id"
children = [{ key = "needs", field = "use", level = "room" }]

[[levels]]
level = "building"
files = ["data/buildings/pieces.toml"]
table = "pieces"
id = "id"
name = "name"
children = [{ key = "rooms", field = "id", level = "room" }]

[[levels]]
level = "room"
files = ["data/buildings/rooms.toml"]
table = "rooms"
id = "use"
children = [{ key = "fixtures", field = "id", level = "asset" }]
